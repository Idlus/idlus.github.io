      - name: Bouclier (lecture seule, sans pseudo)
        if: inputs.etape == 'bouclier-diagnostic'
        run: |
          echo "SSHO=$SSHO" >> "$GITHUB_ENV"
          echo '== Refus par heure (48 h)'
          bash tools/serveur/vps_sql.sh lecture "select date_trunc('hour', at) h, count(*) n, count(distinct user_id) comptes from public.bouclier_log where at > now() - interval '48 hours' group by 1 order by 1"
          echo '== Raisons (24 h, noms retirés)'
          bash tools/serveur/vps_sql.sh lecture "select regexp_replace(regexp_replace(why, '^[^:]{1,20} : ', '<héros> : '), '[0-9][0-9  ,.]*', '#', 'g') raison, count(*) n, count(distinct user_id) comptes, min(at) premier, max(at) dernier from public.bouclier_log where at > now() - interval '24 hours' group by 1 order by 2 desc limit 40"
          echo '== Comptes refusés (24 h, numérotés, sans pseudo)'
          bash tools/serveur/vps_sql.sh lecture "with b as (select user_id, count(*) n, max(at) dernier from public.bouclier_log where at > now() - interval '24 hours' group by 1), w as (select distinct on (user_id) user_id, why from public.bouclier_log where at > now() - interval '24 hours' order by user_id, at desc) select row_number() over (order by b.n desc) compte, b.n refus, w.why derniere_raison, round(extract(epoch from now() - o.at) / 3600) h_sans_validation, o.res reserve_h, o.bilan->>'lv' niveaux, o.bilan->>'k' kamas_valides, o.bilan->>'r' ressources_validees, l.suspect, l.flagged, l.verified from b join w using (user_id) left join public.saves_ok o using (user_id) left join public.ladder l using (user_id) order by b.n desc"
          echo '== Maîtrise : meilleurs héros (parties validées, sans pseudo)'
          bash tools/serveur/vps_sql.sh lecture "select (h->>'mt')::int mt, l.suspect, l.flagged, l.verified, round(extract(epoch from now() - o.at) / 3600) h_validee from public.ladder l join public.saves_ok o using (user_id), jsonb_array_elements(l.heroes) h where (h->>'mt') is not null order by 1 desc limit 25"
          echo '== Comptes retirés (sans pseudo)'
          bash tools/serveur/vps_sql.sh lecture "select row_number() over (order by l.user_id) compte, exists (select 1 from public.admins a where a.user_id = l.user_id) admin, o.at valide_a, o.src_at, o.accept, o.bilan is null bilan_vide, o.bilan->>'mt' mt_bilan, (select max(at) from public.bouclier_log b where b.user_id = l.user_id) dernier_refus, (select left(why, 120) from public.bouclier_log b where b.user_id = l.user_id order by at desc limit 1) derniere_raison, (select count(*) from public.saves_jour j where j.user_id = l.user_id) copies, s.updated_at envoi from public.ladder l left join public.saves_ok o using (user_id) left join public.saves s using (user_id) where l.flagged"
          echo '== Classement'
          bash tools/serveur/vps_sql.sh lecture "select count(*) filter (where suspect and not flagged) suspects, count(*) filter (where flagged) retires, count(*) filter (where verified) verifies, count(*) filter (where suspect and updated_at > now() - interval '24 hours') suspects_24h from public.ladder"
          echo '== Parties validées'
          bash tools/serveur/vps_sql.sh lecture "select (select count(*) from public.saves where updated_at > now() - interval '1 hour') envois_1h, (select count(*) from public.saves_ok where at > now() - interval '1 hour') valides_1h, (select count(*) from public.saves s join public.saves_ok o using (user_id) where s.updated_at > o.src_at + interval '30 minutes' and s.updated_at > now() - interval '2 hours') en_retard, (select max(at) from public.saves_ok) derniere_validation"
          bash tools/serveur/vps_sql.sh commande "echo '== Fonction record (2 h)'; docker logs --since 120m supabase-edge-functions 2>&1 | grep -iE 'error|erreur|exception|limit|timeout|boot' | tail -40"
      - name: Vote sur Dofus Fan Games, clé de l'API (secret DFG_VOTE_KEY, jamais affichée)
        # 02/11/2026 : récompense de vote (supabase/vote.sql, supabase/functions/vote). À lancer une fois après « Serveur en ligne »,
        # et de nouveau si Mathis change la clé sur le site. La clé n'est écrite que dans public.vote_cfg (lisible par la seule fonction).
        if: inputs.etape == 'vote-cle'
        env:
          CLE: ${{ secrets.DFG_VOTE_KEY }}
        run: |
          CLE=$(printf '%s' "$CLE" | tr -d '[:space:]'); CLE=${CLE##*/servers/}; CLE=${CLE%%/*}
          if ! printf '%s' "$CLE" | grep -qE '^[A-Za-z0-9_-]{8,200}$'; then echo "Secret DFG_VOTE_KEY absent ou illisible (la clé seule, sans l'adresse)." >&2; exit 1; fi
          printf "update public.vote_cfg set cle = \$cle\$%s\$cle\$, actif = true where id = 1;\n" "$CLE" > /tmp/cle.sql
          bash tools/serveur/vps_sql.sh fichier /tmp/cle.sql; rm -f /tmp/cle.sql
          bash tools/serveur/vps_sql.sh lecture "select (cle is not null) as cle_posee, actif, length(cle) as longueur from public.vote_cfg"
          bash tools/serveur/vps_sql.sh commande 'ls -l volumes/functions/vote/ && docker logs --since 10m supabase-edge-functions 2>&1 | grep -iE "vote" | grep -iE "error|erreur|exception" | tail -10'
