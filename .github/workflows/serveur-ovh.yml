      - name: Enquête sur un joueur, 3 serveurs (lecture seule, demande de Mathis)
        if: inputs.etape == 'enquete-3-serveurs'
        env:
          PSEUDO: ${{ inputs.pseudo }}
        run: |
          # 04/11/2026 : « vérifie le joueur François et dit moi si il triche regarde la sauvegarde » (Mathis). Lecture seule,
          # Éternel (public), Classique S1 (s1) et Monocompte (mono). Le journal n'affiche que des chiffres de jeu.
          p=$(printf '%s' "$PSEUDO" | tr -cd 'A-Za-z0-9_-'); [ -n "$p" ] || { echo "Pseudo manquant." >&2; exit 1; }
          d="$RUNNER_TEMP/enq"; mkdir -p "$d"
          for sc in public s1; do
            bash tools/serveur/vps_sql.sh lecture "select p.pseudo, p.created_at as cree, s.data as save, s.updated_at as save_at,
              (select row_to_json(x) from (select l.suspect, l.flagged, l.verified, l.flag_reason, l.level, l.playtime, l.updated_at from $sc.ladder l where l.user_id = p.id) x) as ladder,
              (select row_to_json(x) from (select o.bilan, o.res, o.src_at, o.at, o.accept from $sc.saves_ok o where o.user_id = p.id) x) as ok,
              (select o.data from $sc.saves_ok o where o.user_id = p.id) as ok_data,
              (select row_to_json(x) from (select k.w, k.cote, k.n, k.win, k.loss from $sc.koli k where k.user_id = p.id) x) as koli,
              (select coalesce(json_agg(x order by x.at desc), '[]') from (select b.why, b.at from $sc.bouclier_log b where b.user_id = p.id order by b.at desc limit 60) x) as bouclier,
              (select coalesce(json_agg(x), '[]') from (select g.code, g.at from public.gift_uses g where g.user_id = p.id order by g.at) x) as codes,
              (select coalesce(json_agg(x), '[]') from (select j.day, j.at, j.data from $sc.saves_jour j where j.user_id = p.id) x) as jours
              from public.profiles p left join $sc.saves s on s.user_id = p.id where lower(p.pseudo) = lower('$p')" > "$d/$sc.json"
            echo; echo "################ Serveur $sc ################"
            node tools/enquete_joueur.js "$d/$sc.json" || true
          done
          bash tools/serveur/vps_sql.sh lecture "select p.pseudo, p.created_at as cree, m.data as save, m.updated_at as save_at, m.saison,
            (select row_to_json(x) from (select o.resume, o.bilan, o.res, o.src_at, o.at, o.accept from mono.parties_ok o where o.user_id = p.id and o.saison = m.saison) x) as ok,
            (select o.data from mono.parties_ok o where o.user_id = p.id and o.saison = m.saison) as ok_data,
            (select coalesce(json_agg(x order by x.at desc), '[]') from (select b.why, b.at from mono.bouclier b where b.user_id = p.id order by b.at desc limit 60) x) as bouclier,
            '[]'::json as codes, '[]'::json as jours
            from public.profiles p join mono.parties m on m.user_id = p.id where lower(p.pseudo) = lower('$p') order by m.saison desc limit 1" > "$d/mono.json"
          echo; echo "################ Serveur Monocompte ################"
          node tools/enquete_joueur.js "$d/mono.json" || true
          echo "== Monocompte : opérations du serveur depuis la dernière partie validée (sans contenu, #172)"
          bash tools/serveur/vps_sql.sh lecture "select o.id, o.at, (select array_agg(k) from jsonb_object_keys(o.payload) k) as cles, o.payload->'k' as k, o.payload ? 'vote' as vote,
            o.payload ? 'sold' as sold, o.payload ? 'got' as got, left(o.txt, 70) as txt from mono.ops o join public.profiles p on p.id = o.user_id
            where lower(p.pseudo) = lower('$p') and o.id > coalesce((select (x.bilan->>'op')::bigint from mono.parties_ok x where x.user_id = p.id order by x.saison desc limit 1), 0) - 5 order by o.id" || true
          rm -rf "$d"
      - name: Francois suspendu 7 jours et partie Monocompte remise à zéro (essai ou pour de vrai, ordre écrit de Mathis du 04/11)
