        run: |
          # Lecture seule : pseudo et date du succès « Tous les Dofus » (ach.dofus31), rien d'autre de la partie.
          bash tools/serveur/vps_sql.sh lecture "select row_number() over (order by ((s.data::jsonb)->'ach'->>'dofus31')::bigint) rang, public.pseudo_of(s.user_id) pseudo, case when ((s.data::jsonb)->'ach'->>'dofus31')::bigint > 1000 then to_char(to_timestamp(((s.data::jsonb)->'ach'->>'dofus31')::bigint / 1000.0) at time zone 'Europe/Paris', 'DD/MM HH24:MI') else 'date inconnue' end quand from public.saves s where coalesce((s.data::jsonb)->'ach'->>'dofus31', '') ~ '^[0-9]+$' order by ((s.data::jsonb)->'ach'->>'dofus31')::bigint limit 25"
      - name: Relevé d'équilibrage de la Saison 1 (lecture seule, sans pseudo)
        if: inputs.etape == 'releve-equilibrage'
        run: |
