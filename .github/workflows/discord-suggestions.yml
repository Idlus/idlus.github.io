# Suggestions vers Discord (0.1.36) : toutes les 10 minutes, publie dans le forum #idées les idées envoyées depuis le jeu
# (Communauté › Suggestions, table « ideas » de supabase/idees.sql), un fil par idée avec son tag, puis note l'adresse du fil.
# Secrets : SUPABASE_ACCESS_TOKEN (lire et marquer les idées) et DISCORD_BOT_TOKEN (publier).
name: Suggestions vers Discord
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suggestions-discord
  cancel-in-progress: false
env:
  PROJECT_REF: bolbuxuxydfslwpfbfff
jobs:
  relais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Idées en attente → forum #idées
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_SORTIE: /tmp/publiees.json
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$DISCORD_BOT_TOKEN" ]; then echo "Secret manquant." >&2; exit 1; fi
          sql() { jq -n --arg q "$1" '{query: $q}' > /tmp/q.json
            code=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
            if [ "$code" -ge 300 ]; then echo "Erreur HTTP $code"; head -c 600 /tmp/r.json; echo; exit 1; fi; }
          sql "select to_regclass('public.ideas') is not null as ok"
          if [ "$(jq -r '.[0].ok' /tmp/r.json)" != "true" ]; then echo "Table ideas absente : rien à faire."; exit 0; fi
          sql "select id, tag, title, body, pseudo, info, (user_id is null) as guest from public.ideas where relayed_at is null and not hidden order by id limit 10"
          cp /tmp/r.json /tmp/idees.json; n=$(jq length /tmp/idees.json); echo "Idées en attente : $n"
          if [ "$n" = "0" ]; then exit 0; fi
          echo '[]' > "$DISCORD_SORTIE"
          status=0; node tools/discord_bot.js suggestions /tmp/idees.json || status=$?
          if [ "$(jq length "$DISCORD_SORTIE")" != "0" ]; then
            # seulement des numéros et des adresses discord.com fabriqués par le robot
            j=$(jq -c '[.[] | {id: (.id | tonumber), url: (.url | select(test("^https://discord\\.com/channels/[0-9]+/[0-9]+$")))}]' "$DISCORD_SORTIE")
            sql "update public.ideas i set relayed_at = now(), url = v.url from jsonb_to_recordset(\$j\$${j}\$j\$::jsonb) as v(id bigint, url text) where i.id = v.id"
            echo "Idées marquées publiées : $(jq length "$DISCORD_SORTIE")"
          fi
          exit $status
