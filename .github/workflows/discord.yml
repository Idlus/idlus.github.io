name: Annonce Discord
# 2.1.30.4 : seulement à la main, après l'accord écrit de Mathis ; une publication du jeu (push sur main) ne poste plus rien sur Discord
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à annoncer (ex. 2.1.30.4), doit exister dans changelog.json"
        required: true
        type: string
      essai:
        description: "Essai : affiche le message sans rien envoyer"
        type: boolean
        default: true
      renvoyer:
        description: "Renvoyer même si cette version est déjà annoncée"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: # une seule annonce à la fois : la deuxième attend la première, puis voit qu'elle est déjà publiée
  group: annonce-discord
  cancel-in-progress: false
jobs:
  annonce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Essai (aucun envoi)
        if: ${{ inputs.essai }}
        env:
          VERSION: ${{ inputs.version }}
        run: node tools/post_discord.js "$VERSION" --strict --print
      - name: Envoi sur Discord
        if: ${{ !inputs.essai }}
        env:
          VERSION: ${{ inputs.version }}
          RENVOYER: ${{ inputs.renvoyer }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node tools/post_discord.js "$VERSION" --strict
