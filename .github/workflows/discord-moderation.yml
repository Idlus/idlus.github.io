# Journal de modération vers Discord (2.2.2 « Les modérateurs », réponse 6B de Mathis) : toutes les 10 minutes, envoie dans le
# salon privé #modération les actions faites dans le jeu par les modérateurs (table admin_log de supabase/chat.sql, lignes dont
# l'auteur est dans « mods » et discord_at vide), puis marque ces lignes envoyées. Les actions de Mathis n'y vont pas.
# Secrets : VPS_HOST, VPS_USER, VPS_NEW_PASSWORD (serveur OVH : lire et marquer) et DISCORD_BOT_TOKEN (publier).
name: Journal de modération vers Discord
on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moderation-discord
  cancel-in-progress: false
jobs:
  relais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: ./.github/actions/vps
        with:
          hote: ${{ secrets.VPS_HOST }}
          util: ${{ secrets.VPS_USER }}
          pass: ${{ secrets.VPS_NEW_PASSWORD }}
      - name: Actions des modérateurs → #modération
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_SORTIE: /tmp/envoyees.json
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then echo "Secret DISCORD_BOT_TOKEN manquant." >&2; exit 1; fi
          sql() { bash tools/serveur/vps_sql.sh json "$1" > /tmp/r.json || { echo "Erreur de la base"; head -c 600 /tmp/r.json; echo; exit 1; }; }
          sql "select exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'admin_log' and column_name = 'discord_at') as ok"
          if [ "$(jq -r '.[0].ok' /tmp/r.json)" != "true" ]; then echo "Colonne admin_log.discord_at absente : rien à faire."; exit 0; fi
          sql "select a.id, a.at, a.txt, public.pseudo_of(a.by_user) as who from public.admin_log a where a.discord_at is null and a.by_user in (select user_id from public.mods) and a.by_user not in (select user_id from public.admins) order by a.id limit 50"
          cp /tmp/r.json /tmp/actions.json; n=$(jq length /tmp/actions.json); echo "Actions en attente : $n"
          if [ "$n" = "0" ]; then exit 0; fi
          echo '[]' > "$DISCORD_SORTIE"
          status=0; node tools/discord_bot.js moderation /tmp/actions.json || status=$?
          ids=$(jq -c '[.[] | tonumber]' "$DISCORD_SORTIE")
          if [ "$ids" != "[]" ]; then
            sql "update public.admin_log set discord_at = now() where id in (select (jsonb_array_elements_text(\$j\$${ids}\$j\$::jsonb))::bigint) returning id"
            echo "Actions marquées envoyées : $(jq length "$DISCORD_SORTIE")"
          fi
          exit $status
