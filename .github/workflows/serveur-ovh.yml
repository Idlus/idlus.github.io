          done
          bash tools/serveur/vps_sql.sh lecture "select 'après', (select count(*) from public.amis where srv = 'c') amis_c, (select count(*) from public.amis where srv = 'm') amis_m, (select count(*) from public.amis_demandes where srv = 'm') demandes_m"
