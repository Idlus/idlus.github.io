# Version de test de la 4.0 : chaque push sur la branche « beta » est recopié dans le dossier beta/ de main,
# publié par GitHub Pages à l'adresse https://idlus.github.io/beta/ (sauvegarde séparée du jeu public).
name: Version de test
on:
  push:
    branches: [beta]
permissions:
  contents: write
concurrency:
  group: version-de-test
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Code de la branche beta
        uses: actions/checkout@v4
        with: { ref: beta, path: beta-src }
      - name: Branche main
        uses: actions/checkout@v4
        with: { ref: main, path: site }
      - name: Copie dans main/beta/
        run: |
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude 'beta/' --exclude 'tests/' --exclude 'tools/' \
            --exclude 'data/' --exclude 'node_modules/' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude '*.md' --exclude 'changelog.json' \
            beta-src/ site/beta/
      - name: Publication
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Version de test : $(git -C ../beta-src log -1 --format='%h %s')"
          git push origin main
