# Publie chaque lundi matin le podium des donjons de la semaine passée dans #annonces sur Discord (le mutateur est à l'heure depuis 0.1.47.1 : plus de post). Nécessite le secret DISCORD_BOT_TOKEN.
name: Podium de la semaine sur Discord
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
jobs:
  semaine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Podium des donjons de la semaine passée
        run: node tools/discord_bot.js podium
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
