<title>Idle d'Amakna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fondamento&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Mise en page : une colonne centrée, navigation en bas sur mobile, onglets en haut sur grand écran.
   Ambiance : parchemin et bois d'Amakna, sobre, une information à la fois. */
:root {
  --bg: #ece2cb;          /* parchemin */
  --panel: #f7f0de;       /* feuille claire */
  --panel-2: #e3d6b8;     /* parchemin foncé */
  --ink: #2c2216;         /* encre */
  --muted: #76664c;
  --line: #cfbd98;
  --wood: #5a3e25;        /* cadre bois */
  --wood-ink: #f6ead0;
  --accent: #4a6b25;      /* vert d'Amakna */
  --accent-ink: #f4f1e2;
  --gold: #a3741a;        /* rare */
  --danger: #a33f2c;
  --good: #3f7a3a;
  --hp: #b8442f;
  --hp-bg: #e6d2c4;
  --xp: #c08a1e;
  --el-t: #8a6436; --el-f: #c2452c; --el-e: #2f6fae; --el-a: #3f8b4c; --el-n: #7b7466;
  --q-commun: #76664c; --q-bon: #3f7a3a; --q-excellent: #2f6fae; --q-parfait: #a3741a;
  --shadow: 0 1px 0 rgba(90, 62, 37, .18);
  --f-display: "Fondamento", "Palatino Linotype", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-label: "Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17120d; --panel: #221a13; --panel-2: #2c2219; --ink: #efe2c6; --muted: #a8967a; --line: #3e3124;
  --wood: #3a2918; --wood-ink: #f1e3c4; --accent: #8fb55c; --accent-ink: #18200e; --gold: #dcab48; --danger: #e07a62; --good: #8fc27e;
  --hp: #d4614a; --hp-bg: #3a2a22; --xp: #d9a640;
  --el-t: #c39a64; --el-f: #e57a5e; --el-e: #6aa7e0; --el-a: #77c085; --el-n: #a7a093;
  --q-commun: #a8967a; --q-bon: #8fc27e; --q-excellent: #6aa7e0; --q-parfait: #dcab48;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #17120d; --panel: #221a13; --panel-2: #2c2219; --ink: #efe2c6; --muted: #a8967a; --line: #3e3124;
  --wood: #3a2918; --wood-ink: #f1e3c4; --accent: #8fb55c; --accent-ink: #18200e; --gold: #dcab48; --danger: #e07a62; --good: #8fc27e;
  --hp: #d4614a; --hp-bg: #3a2a22; --xp: #d9a640;
  --el-t: #c39a64; --el-f: #e57a5e; --el-e: #6aa7e0; --el-a: #77c085; --el-n: #a7a093;
  --q-commun: #a8967a; --q-bon: #8fc27e; --q-excellent: #6aa7e0; --q-parfait: #dcab48;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; }
.label { font-family: var(--f-label); font-weight: 500; letter-spacing: .04em; font-size: 13px; color: var(--muted); }

/* ---------- Structure ---------- */
#app { min-height: 100%; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--wood); color: var(--wood-ink); box-shadow: 0 2px 0 rgba(0,0,0,.15);
}
.top-in { max-width: 1080px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--f-display); font-size: 20px; line-height: 1; white-space: nowrap; }
.top .spacer { flex: 1; }
.purse { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.kama { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f3d27a, #b07f1d 70%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); display: inline-block; }
.icon-btn { background: transparent; border: 1px solid rgba(246, 234, 208, .35); color: var(--wood-ink); border-radius: 6px; padding: 4px 10px; }
.tabs-top { display: none; }
main { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 96px; display: flex; flex-direction: column; gap: 14px; }
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--wood); padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.nav-btn { background: none; border: 0; color: var(--wood-ink); opacity: .72; padding: 10px 2px 9px; font-family: var(--f-label); font-size: 13px; letter-spacing: .03em; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn[aria-current="page"] { opacity: 1; color: #f3d27a; }
@media (min-width: 860px) {
  .bottom-nav { display: none; }
  main { padding-block: 18px 40px; }
  .tabs-top { display: flex; gap: 4px; }
  .tabs-top .nav-btn { flex-direction: row; font-size: 14px; padding: 6px 12px; border-radius: 6px; }
  .tabs-top .nav-btn svg { width: 18px; height: 18px; }
  .tabs-top .nav-btn[aria-current="page"] { background: rgba(0,0,0,.22); }
}

/* ---------- Éléments communs ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.pad { padding: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 3px 8px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 12px; color: var(--muted); font-family: var(--f-label); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--wood); color: var(--wood-ink); }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); font-family: var(--f-label); font-size: 15px; white-space: nowrap; }
.subtabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--gold); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; max-width: 100%; }
.bar { height: 6px; background: var(--hp-bg); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--hp); transition: width .25s; }
.bar.xp > i { background: var(--xp); }
.bar.prog > i { background: var(--accent); transition: none; }
.bar.shield { box-shadow: 0 0 0 1px var(--el-e); }
.el { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.el-t { background: var(--el-t); } .el-f { background: var(--el-f); } .el-e { background: var(--el-e); } .el-a { background: var(--el-a); } .el-n { background: var(--el-n); }
.cls { display: inline-flex; width: 30px; height: 30px; border-radius: 50%; align-items: center; justify-content: center; color: #fff; font-family: var(--f-display); font-size: 16px; flex: none; }
.q-commun { color: var(--q-commun); } .q-bon { color: var(--q-bon); } .q-excellent { color: var(--q-excellent); } .q-parfait { color: var(--q-parfait); font-weight: 700; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
.tag.gold { border-color: var(--gold); color: var(--gold); }
.tag.good { border-color: var(--good); color: var(--good); }
.list { display: flex; flex-direction: column; }
.list > .li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); min-width: 0; }
.list > .li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .name { font-weight: 500; overflow-wrap: anywhere; }
.plus { color: var(--good); } .minus { color: var(--danger); }
.empty { padding: 18px; text-align: center; color: var(--muted); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 14px; }
.statgrid .s { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--line); padding: 2px 0; font-size: 14px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-title h2 { font-size: 22px; }

/* ---------- Combat ---------- */
.where { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.where h1 { font-size: 26px; }
.arena { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.side .label { margin-bottom: 2px; }
.unit { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; min-width: 0; transition: opacity .3s; }
.unit.dead { opacity: .4; }
.unit.archi { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.unit.boss { border-width: 2px; border-color: var(--wood); }
.unit .nm { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .hpline { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 12px; }
.unit .hpline .bar { flex: 1; }
.log { font-size: 13px; line-height: 1.5; max-height: 210px; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column-reverse; }
.log div { overflow-wrap: anywhere; }
.log .m { color: var(--danger); } .log .heal { color: var(--good); } .log .buff { color: var(--el-e); }
.log .ko, .log .dim { color: var(--muted); } .log .win { color: var(--accent); font-weight: 700; } .log .lose { color: var(--danger); font-weight: 700; } .log .crit { font-weight: 700; }
.journal .li { font-size: 14px; padding: 6px 12px; }
.journal .k-rare { color: var(--gold); font-weight: 700; } .journal .k-up { color: var(--accent); } .journal .k-warn { color: var(--danger); } .journal .k-loot { color: var(--el-e); }
.fs-badge { font-family: var(--f-label); font-size: 14px; }
@media (max-width: 520px) {
  .where h1 { font-size: 22px; }
  .unit { padding: 6px 7px; }
  .unit .cls { width: 24px; height: 24px; font-size: 13px; }
}

/* ---------- Équipe ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--wood); box-shadow: inset 0 0 0 1px var(--wood); }
.chip.out { opacity: .6; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.slot { text-align: left; background: var(--panel); border: 1px dashed var(--line); border-radius: 7px; padding: 8px 10px; min-height: 58px; display: flex; flex-direction: column; gap: 2px; }
.slot.filled { border-style: solid; }
.slot[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.slot .sl { font-family: var(--f-label); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.spellrow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.spellrow .ord { display: flex; flex-direction: column; gap: 2px; }
.spellrow .ord button { padding: 0 6px; line-height: 1.2; font-size: 12px; }

/* ---------- Ateliers ---------- */
.job { display: flex; flex-direction: column; gap: 8px; }
.ing { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.ing .ok { color: var(--good); } .ing .ko { color: var(--danger); }
.emblem-head { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.seal { width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: radial-gradient(circle at 40% 35%, var(--panel), var(--panel-2)); border: 3px double var(--gold); color: var(--gold); font-family: var(--f-display); }
.seal b { font-size: 24px; line-height: 1; font-weight: 400; }
.seal span { font-size: 10px; font-family: var(--f-label); letter-spacing: .06em; }

/* ---------- Carte ---------- */
.zone h2 { font-size: 24px; }
.sub { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.sub.locked { opacity: .55; }
.sub.here { background: var(--panel-2); }
.dungeon { border-left: 3px solid var(--wood); }

/* ---------- Divers ---------- */
.toasts { position: fixed; z-index: 40; top: calc(env(safe-area-inset-top, 0px) + 56px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; width: min(420px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--wood); color: var(--wood-ink); border-radius: 8px; padding: 8px 12px; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); animation: tin .25s ease-out; }
.toast.rare { box-shadow: 0 0 0 2px var(--gold), 0 4px 14px rgba(0,0,0,.25); }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .bar > i { transition: none; } }
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(20, 14, 8, .5); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
@media (min-width: 640px) { .sheet-bg { align-items: center; } }
.sheet { background: var(--panel); color: var(--ink); border-radius: 10px; border: 1px solid var(--line); width: min(560px, 100%); max-height: 86vh; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { font-size: 24px; }
textarea { width: 100%; min-height: 90px; font: 12px/1.3 ui-monospace, Menlo, monospace; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.start { max-width: 720px; margin: 0 auto; }
.start h1 { font-size: 40px; }
.classpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.classpick button { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.classpick button[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
input[type="text"] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; max-width: 320px; }
.note { font-size: 13px; color: var(--muted); }
</style>

<div id="app">
  <header class="top"><div class="top-in">
    <span class="brand">Idle d'Amakna</span>
    <nav class="tabs-top" id="tabsTop" aria-label="Onglets"></nav>
    <span class="spacer"></span>
    <span class="purse num" id="purse" title="Kamas"><i class="kama"></i><span id="kamas">0</span></span>
    <button class="icon-btn" data-act="options" aria-label="Options">Options</button>
  </div></header>
  <main id="main"><div class="empty">Chargement de l'aventure…</div></main>
  <nav class="bottom-nav" id="tabsBottom" aria-label="Onglets"></nav>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="sheet"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function () {
"use strict";
const D = window.DATA, E = window.ENGINE;
const { STATS, STAT_ORDER, BASE_STATS, ELEMENTS, CLASSES, CONDITIONS, GATHER_JOBS, CRAFT_JOBS, SLOTS, MONSTERS, ZONES, DUNGEONS, ITEMS, SETS, SPECIAL_CRAFTS, EMBLEM } = D;

let S = null;
const ui = { tab: "combat", cid: null, charTab: "stats", slot: null, bagTab: "items", slotFilter: "all", ateTab: "recolte", craftJob: "tailleur", focus: "", startCls: "iop", confirm: null, giveTo: null };
const LS_KEY = "idle-amakna-save";

/* ---------- Utilitaires d'affichage ---------- */
const $ = (s) => document.querySelector(s);
const h = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Math.floor(n).toLocaleString("fr-FR");
const pct = (a, b) => Math.max(0, Math.min(100, b ? (a / b) * 100 : 0));
const elDot = (el) => `<span class="el el-${el}" title="${ELEMENTS[el].name}">${ELEMENTS[el].name[0]}</span>`;
const clsBadge = (cls) => `<span class="cls" style="background:${CLASSES[cls].color}" aria-hidden="true">${CLASSES[cls].name[0]}</span>`;
const statLine = (k, v) => `${v > 0 ? "+" : ""}${fmt(v)} ${STATS[k].name.replace("% ", "")}${k.startsWith("r") && k !== "res" ? " %" : ""}`;
const fmtStatVal = (k, v) => (["cri", "rt", "rf", "re", "ra"].includes(k) ? `${fmt(v)} %` : fmt(v));
const char = (id) => S.chars.find((c) => c.id === id);
const dur = (s) => { s = Math.round(s); const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60); return hh ? `${hh} h ${mm} min` : `${mm} min`; };

const ICONS = {
  combat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20 14 10M14 4l6 6-3 1-3-3-1-3zM5 15l4 4M3 21l2-2"/></svg>',
  equipe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.5 3-5.5 6-5.5s5.4 2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.6c2.6.2 4.3 2 4.8 4.6"/></svg>',
  sac: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  ateliers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 21l8-8M14 4l6 6-4 4-6-6 4-4z"/><path d="M4 9h5M6.5 6.5v5"/></svg>',
  carte: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z"/><path d="M9 4v14M15 6v14"/></svg>',
};
const TABS = [["combat", "Combat"], ["equipe", "Équipe"], ["sac", "Sac"], ["ateliers", "Ateliers"], ["carte", "Carte"]];

function renderNav() {
  const html = TABS.map(([id, n]) => `<button class="nav-btn" data-tab="${id}" ${ui.tab === id ? 'aria-current="page"' : ""}>${ICONS[id]}<span>${n}</span></button>`).join("");
  $("#tabsTop").innerHTML = html; $("#tabsBottom").innerHTML = html;
}

/* ---------- Écran de départ ---------- */
function renderStart() {
  $("#tabsTop").innerHTML = ""; $("#tabsBottom").innerHTML = "";
  $("#main").innerHTML = `
  <section class="start stack">
    <h1>Bienvenue sur Incarnam</h1>
    <p class="muted">Choisissez votre premier personnage. Il combat seul, automatiquement : à vous d'optimiser son équipement et ses sorts. Vous pourrez recruter jusqu'à 8 personnages, ou rester seul pour profiter du bonus Esprit Libre et de l'Emblème du Solitaire.</p>
    <div class="classpick">
      ${Object.entries(CLASSES).map(([id, c]) => `
        <button data-act="startcls" data-cls="${id}" aria-pressed="${ui.startCls === id}">
          <span class="row">${clsBadge(id)}<strong>${c.name}</strong></span>
          <span class="small muted">${h(c.desc)}</span>
        </button>`).join("")}
    </div>
    <label class="stack" style="gap:4px"><span class="label">Nom du personnage</span>
      <input type="text" id="startName" maxlength="20" value="${h(D.NAMES[Math.floor(Math.random() * D.NAMES.length)])}"></label>
    <div><button class="btn primary" data-act="startgame">Commencer l'aventure</button></div>
  </section>`;
}

/* ---------- Combat ---------- */
function unitHtml(e) {
  const isC = e.side === "c";
  const badge = isC ? clsBadge(e.cls) : elDot(e.el || "n");

function itemStatsHtml(it, cmp) {

    const perfect = v === b ? " q-parfait" : "";

  }).join("<br>");
}
function deltaHtml(c, slot, uid) {
  const cur = E.charStats(S, c);
  const saved = Object.assign({}, c.equip);
  if (uid) {
    const it = S.items[uid];
    const other = E.equippedBy(S, uid);
    const otherSaved = other && other !== c ? Object.assign({}, other.equip) : null;
    if (otherSaved) for (const k in other.equip) if (other.equip[k] === uid) delete other.equip[k];
    for (const k in c.equip) if (c.equip[k] === uid) delete c.equip[k];
    c.equip[slot] = uid;
    var nw = E.charStats(S, c);
    if (otherSaved) other.equip = otherSaved;
    void it;
  } else { delete c.equip[slot]; var nw = E.charStats(S, c); }
  c.equip = saved;
  const keys = STAT_ORDER.concat(["hpMax"]).filter((k) => k !== "ini" && (nw[k] || 0) !== (cur[k] || 0));
  if (!keys.length) return `<span class="muted small">Aucun changement</span>`;
  return keys.map((k) => { const d = Math.round(nw[k] - cur[k]); const n = k === "hpMax" ? "PV" : STATS[k].short;
    return `<span class="${d > 0 ? "plus" : "minus"} small num">${d > 0 ? "+" : ""}${d} ${n}</span>`; }).join(" ");
}

        <label class="row small"><span class="muted">Récolter</span><select data-act="gather" data-job="${id}">${J.items.map(([r, l]) => `<option value="${h(r)}" ${s.target === r ? "selected" : ""} ${l > s.lvl ? "disabled" : ""}>${h(r)}${l > s.lvl ? ` (niv. ${l})` : ""}</option>`).join("")}</select></label>
        <div class="bar prog" data-gprog="${id}"><i style="width:${pct(s.prog, t)}%"></i></div>
        <div class="small muted num">${t.toFixed(1)} s par récolte · stock : ${fmt(S.res[s.target] || 0)}</div>
      </div>`; }).join("")}</div>`;
  } else if (ui.ateTab === "craft") {
    const job = ui.craftJob; const J = S.crafts[job];
    const recipes = job === "bricoleur"
      ? Object.entries(SPECIAL_CRAFTS).map(([n, R]) => ({ special: n, name: n, lvl: R.lvl, ing: R.ing, req: R.lvl }))
      : Object.entries(ITEMS).filter(([, T]) => T.craft && T.craft.job === job).map(([id, T]) => ({ tpl: id, name: T.name, lvl: T.lvl, ing: T.craft.ing, req: E.craftReq(id), T }))
          .sort((a, b) => a.lvl - b.lvl);
    body = `<div class="row"><nav class="seg" aria-label="Métier">${Object.entries(CRAFT_JOBS).map(([id, c]) => `<button data-act="craftjob" data-v="${id}" aria-pressed="${job === id}">${c.name}</button>`).join("")}</nav>
      <span class="small muted num">${CRAFT_JOBS[job].name} niveau ${J.lvl}</span></div>
      <div class="bar xp" style="max-width:320px"><i style="width:${pct(J.xp, E.jobXpNeed(J.lvl))}%"></i></div>
      <section class="panel"><div class="list">${recipes.map((r) => { const ok = E.canCraft(S, { ing: r.ing }) && J.lvl >= r.req;
        const stats = r.T ? Object.entries(r.T.stats).map(([k, [a, b]]) => `${a === b ? a : a + " à " + b} ${STATS[k].short}`).join(", ") : (r.special && E.isKey(r.special) ? "Clé de donjon" : "Objet spécial");
        return `<div class="li"><span class="grow"><span class="name">${h(r.name)}</span> <span class="muted small">${r.T ? `niv. ${r.lvl} · ` : ""}${stats}${r.T && r.T.set ? ` · ${SETS[r.T.set].name}` : ""}</span>${ingHtml(r.ing)}${J.lvl < r.req ? `<span class="small minus">${CRAFT_JOBS[job].name} niveau ${r.req} requis</span>` : ""}</span>
          <button class="btn sm ${ok ? "primary" : ""}" data-act="craft" ${r.tpl ? `data-tpl="${r.tpl}"` : `data-special="${h(r.special)}"`} ${ok ? "" : "disabled"}>Fabriquer</button></div>`; }).join("") || `<div class="empty">Aucune recette pour ce métier.</div>`}</div></section>`;
  } else if (ui.ateTab === "brisage") {
    const items = Object.values(S.items).filter((it) => !E.equippedBy(S, it.uid)).sort((a, b) => ITEMS[b.tpl].lvl - ITEMS[a.tpl].lvl);
    const focusOpts = `<option value="">Aucun focus</option>${STAT_ORDER.filter((k) => k !== "pa").map((k) => `<option value="${k}" ${ui.focus === k ? "selected" : ""}>Focus ${STATS[k].name}</option>`).join("")}`;
    body = `<p class="note">Briser un objet le détruit et donne des runes selon ses statistiques et son niveau. Le coefficient baisse de 3 % à chaque brisage d'un même objet et remonte de 1 % toutes les ${E.COEF_REGEN_MIN} minutes. Le focus concentre les runes sur une seule caractéristique, au prix de la moitié des autres.</p>
      <div class="row"><select data-act="focus" aria-label="Focus">${focusOpts}</select>
        ${items.length ? (ui.confirm === "breakall" ? `<span class="small">Briser les ${items.length} objets non équipés ?</span><button class="btn sm danger" data-act="breakall">Confirmer</button><button class="btn sm" data-act="cancel">Annuler</button>` : `<button class="btn sm" data-act="askbreakall">Tout briser</button>`) : ""}</div>
      <section class="panel"><div class="list">${items.map((it) => { const p = E.breakPreview(S, it.uid, ui.focus || null);
        const est = Object.entries(p.weights).map(([k, w]) => `${STATS[k].short} ≈ ${(w / (STATS[k].w * STATS[k].pts)).toFixed(1)}`).join(", ");
        return `<div class="li"><span class="grow"><span class="name">${itemName(it)}</span> <span class="muted small">niv. ${ITEMS[it.tpl].lvl} · coefficient <span class="${p.coef < 60 ? "minus" : ""}">${p.coef} %</span></span><br><span class="small muted">Runes simples estimées : ${est || "aucune"}</span></span>
          <button class="btn sm" data-act="break" data-uid="${it.uid}">Briser</button></div>`; }).join("") || `<div class="empty">Aucun objet à briser. Les objets équipés sont protégés.</div>`}</div></section>`;
  } else {
    body = emblemView();
  }
  $("#main").innerHTML = `
  <div class="section-title"><h2>Ateliers</h2></div>
  <nav class="subtabs">${[["recolte", "Récolte"], ["craft", "Artisanat"], ["brisage", "Brisage"], ["embleme", "Emblème"]].map(([id, n]) => `<button data-act="atetab" data-v="${id}" aria-pressed="${ui.ateTab === id}">${n}</button>`).join("")}</nav>
  <section class="stack">${body}</section>`;
}
function emblemView() {
  const em = S.emblem; const need = E.emblemXpNeed(em.lvl); const lines = E.emblemLines(em.lvl);
  const active = E.isSolo(S);
  const nextRank = EMBLEM.ranks.find(([l]) => l > em.lvl);
  const runes = Object.entries(S.runes).sort((a, b) => E.runeInfo(b[0]).weight - E.runeInfo(a[0]).weight);
  const used = Object.keys(em.stats);
  const perkBlock = Object.entries(EMBLEM.perks).map(([tier, opts]) => {
    const chosen = em.perks[tier];
    return `<div class="li"><span class="grow"><span class="name">Palier ${tier}</span><br>${chosen ? `<span class="small">${h(opts.find((o) => o.id === chosen).name)} : ${h(opts.find((o) => o.id === chosen).desc)}</span>` :
      em.lvl >= +tier ? `<span class="row" style="margin-top:4px">${opts.map((o) => `<button class="btn sm" data-act="perk" data-t="${tier}" data-id="${o.id}" title="${h(o.desc)}">${h(o.name)}</button>`).join("")}</span><span class="small muted">${opts.map((o) => `${h(o.name)} : ${h(o.desc)}`).join(" · ")}</span>` :
      `<span class="small muted">Au choix : ${opts.map((o) => h(o.name)).join(", ")}</span>`}</span></div>`; }).join("");
  return `<div class="panel pad stack">
    <div class="emblem-head"><div class="seal"><b class="num">${em.lvl}</b><span>NIVEAU</span></div>
      <div class="stack" style="gap:6px"><div class="row between"><h2 style="font-size:22px">Emblème du Solitaire</h2><span class="tag ${active ? "good" : ""}">${active ? "Actif (solo)" : "Inactif : jouez seul"}</span></div>
        <div class="small muted">Rang ${E.emblemRank(em.lvl)}${nextRank ? ` · prochain rang « ${nextRank[1]} » au niveau ${nextRank[0]}` : ""}</div>
        <div class="bar xp"><i style="width:${pct(em.xp, need)}%"></i></div><div class="small muted num">${em.lvl >= EMBLEM.maxLvl ? "Niveau maximum" : `${fmt(em.xp)} / ${fmt(need)} poids de runes`}</div></div></div>
    <p class="note">Chaque rune donne son poids en expérience à l'Emblème et augmente la ligne de sa caractéristique, dans la limite du plafond (qui grandit avec le niveau). L'Emblème possède ${lines} ligne${lines > 1 ? "s" : ""} de caractéristiques à ce niveau.</p>
  </div>
  <div class="grid2">
    <div class="panel"><div class="pad section-title"><h2 style="font-size:20px">Lignes</h2><span class="muted small">${used.length}/${lines}</span></div>
      <div class="list">${used.map((k) => { const cap = E.emblemCap(k, em.lvl); return `<div class="li"><span class="grow"><span class="name">${STATS[k].name}</span><div class="bar prog" style="margin-top:4px"><i style="width:${pct(em.stats[k], cap)}%"></i></div></span><span class="num">${fmt(em.stats[k])} / ${fmt(cap)}</span>
        ${ui.confirm === "line:" + k ? `<button class="btn sm danger" data-act="remline" data-k="${k}">Effacer</button>` : `<button class="btn sm" data-act="askline" data-k="${k}" title="Libère la ligne (la valeur est perdue)">×</button>`}</div>`; }).join("") || `<div class="empty">Nourrissez l'Emblème avec une rune pour ouvrir une ligne.</div>`}</div></div>
    <div class="panel"><div class="pad section-title"><h2 style="font-size:20px">Nourrir avec des runes</h2></div>
      <div class="list">${runes.map(([k, q]) => { const i = E.runeInfo(k); const blocked = !used.includes(i.stat) && used.length >= lines;
        return `<div class="li"><span class="grow"><span class="name">${E.runeName(k)}</span> <span class="small muted num">×${fmt(q)} · +${i.pts} ${STATS[i.stat].short} · ${i.weight} XP</span>${blocked ? `<br><span class="small muted">Plus de ligne libre : seule l'expérience sera gagnée.</span>` : ""}</span>
          <button class="btn sm" data-act="feed" data-k="${k}" data-q="1">×1</button><button class="btn sm" data-act="feed" data-k="${k}" data-q="${q}">Tout</button></div>`; }).join("") || `<div class="empty">Aucune rune. Brisez des objets pour en obtenir.</div>`}</div></div>
  </div>
  <div class="panel"><div class="pad"><h2 style="font-size:20px">Paliers</h2></div><div class="list">${perkBlock}
    <div class="li"><span class="grow"><span class="name">Paliers suivants</span><br><span class="small muted">Niveau 100 : 3e ligne · 400 : 4e ligne · 700 : 5e ligne · 850 : plafonds ×1,5 · 1000 : +1 PA</span></span></div></div></div>`;
}

/* ---------- Carte ---------- */
function renderMap() {
  const zones = ZONES.map((z) => {
    const zu = E.zoneUnlocked(S, z.id);
    const subs = z.subs.map((s, i) => {
      const un = E.subUnlocked(S, s.id); const here = S.sub === s.id && !S.dungeon;
      if (s.hidden && !un) return `<div class="li sub locked"><div><span class="name">Lieu caché</span><br><span class="small muted">On raconte qu'un objet permet de rapetisser… (Baguette Rikiki, Bricoleur)</span></div></div>`;
      let prev = z.subs[i - 1]; if (prev && prev.hidden) prev = z.subs[i - 2];
      const why = !zu ? `Battez ${MONSTERS[DUNGEONS[z.requires.boss].boss].name}` : prev ? `${S.progress.wins[prev.id] || 0}/${E.WINS_TO_UNLOCK} victoires dans ${prev.name}` : "";
      const mons = s.monsters.map((m) => MONSTERS[m].name).join(", ");
      const dg = s.dungeon ? DUNGEONS[s.dungeon] : null;
      const dgHtml = dg && un ? (() => { const kills = S.progress.bossKills[s.dungeon] || 0; const keys = S.res[dg.key] || 0;
        return `<div class="li dungeon" style="grid-column:1/-1"><div class="grow"><span class="name">Donjon : ${dg.name}</span> <span class="muted small">boss ${MONSTERS[dg.boss].name}, niv. ${dg.lvl}${kills ? ` · vaincu ${kills} fois` : ""}</span><br>
          <span class="small">${h(dg.key)} : <strong class="num">${keys}</strong></span> <span class="small muted">· fabriquée par le Bricoleur, ou trouvée sur les monstres de la sous-zone</span></div>
          <button class="btn sm ${keys ? "primary" : ""}" data-act="enterdg" data-id="${s.dungeon}" ${keys && !S.dungeon ? "" : "disabled"}>Entrer</button></div>`; })() : "";
      return `<div class="li sub ${un ? "" : "locked"} ${here ? "here" : ""}"><div style="min-width:0"><span class="name">${h(s.name)}</span> <span class="muted small num">niv. ${s.lvl[0]}–${s.lvl[1]}</span>${here ? ` <span class="tag good">Vous êtes ici</span>` : ""}<br>
        <span class="small muted">${h(mons)}</span>${un ? `<br><span class="small muted num">${S.progress.wins[s.id] || 0} victoire${(S.progress.wins[s.id] || 0) > 1 ? "s" : ""}</span>` : `<br><span class="small">${h(why)}</span>`}</div>
        ${un ? `<button class="btn sm" data-act="gosub" data-id="${s.id}" ${here ? "disabled" : ""}>${here ? "Ici" : "Combattre ici"}</button>` : `<span class="tag">Verrouillé</span>`}
        </div>${dgHtml}`;
    }).join("");
    return `<section class="panel zone"><div class="pad"><div class="row between"><h2>${z.name}</h2><span class="muted small">niveaux ${z.lvl}</span></div><div class="small muted">${h(z.desc)}</div></div>
      <div class="list">${subs}</div></section>`;
  }).join("");
  const archis = Object.entries(S.archis);
  $("#main").innerHTML = `<div class="section-title"><h2>Carte du Monde des Douze</h2><span class="small muted num">${fmt(S.stats.wins)} victoires · ${dur(S.stats.playtime)} de jeu</span></div>
    ${S.dungeon ? `<p class="note">Vous êtes dans ${DUNGEONS[S.dungeon.id].name}. Quittez le donjon pour changer de zone.</p>` : ""}
    ${zones}
    <section class="panel"><div class="pad section-title"><h2 style="font-size:20px">Archimonstres</h2><span class="small muted">1 chance sur ${Math.round(1 / E.ARCHI_CHANCE)} par monstre</span></div>
      <div class="list">${archis.map(([m, n]) => `<div class="li"><span class="grow name">Archi-${h(MONSTERS[m].name)}</span><span class="num">×${n}</span></div>`).join("") || `<div class="empty">Aucun archimonstre vaincu. Ils rapportent 5 fois plus d'expérience et 3 fois plus de ressources.</div>`}</div></section>`;
}

/* ---------- Feuilles (fenêtres) ---------- */
function openSheet(html) { $("#sheet").innerHTML = `<div class="sheet-bg" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeSheet() { $("#sheet").innerHTML = ""; ui.giveTo = null; }
function recruitSheet() {
  const cost = E.recruitCost(S.chars.length + 1); const top = Math.max(...S.chars.map((c) => c.lvl));
  openSheet(`<h2>Recruter un personnage</h2>
    <p class="small muted">Coût : <strong>${cost ? fmt(cost) + " kamas" : "gratuit"}</strong> (vous avez ${fmt(S.kamas)}). La recrue arrive au niveau ${Math.max(1, Math.floor(top / 2))}. Plus l'équipe est grande, plus le bonus Esprit Libre diminue.</p>
    <div class="classpick">${Object.entries(CLASSES).map(([id, c]) => `<button data-act="startcls" data-cls="${id}" aria-pressed="${ui.startCls === id}"><span class="row">${clsBadge(id)}<strong>${c.name}</strong></span><span class="small muted">${h(c.desc)}</span></button>`).join("")}</div>
    <label class="stack" style="gap:4px"><span class="label">Nom</span><input type="text" id="recName" maxlength="20" value="${h(D.NAMES[Math.floor(Math.random() * D.NAMES.length)])}"></label>
    <div class="row"><button class="btn primary" data-act="recruit" ${S.kamas < cost ? "disabled" : ""}>Recruter</button><button class="btn" data-act="closesheet">Annuler</button></div>`);
}
function giveSheet(uid) {
  const it = S.items[uid]; const T = ITEMS[it.tpl]; ui.giveTo = uid;
  openSheet(`<h2>Équiper ${itemName(it)}</h2><p class="small muted">Niveau ${T.lvl} requis · ${itemStatsHtml(it)}</p>
    <div class="list">${S.chars.map((c) => { const slot = E.slotFor(c, it);
      return `<div class="li"><span class="grow"><span class="name">${h(c.name)}</span> <span class="muted small">niv. ${c.lvl}</span><br>${deltaHtml(c, slot, uid)}</span><button class="btn sm primary" data-act="giveto" data-id="${c.id}" ${T.lvl > c.lvl ? "disabled" : ""}>${T.lvl > c.lvl ? "Niv. trop bas" : "Équiper"}</button></div>`; }).join("")}</div>
    <div><button class="btn" data-act="closesheet">Fermer</button></div>`);
}
function optionsSheet() {
  openSheet(`<h2>Options</h2>
    <div class="stack small">
      <div><span class="label">Sauvegarde</span><br>${h(saveStatus())}</div>
      <div class="row"><button class="btn sm" data-act="savenow">Sauvegarder maintenant</button></div>
      <div><span class="label">Exporter</span><br><span class="muted">Copiez ce texte pour garder une copie ou continuer sur un autre appareil.</span><textarea id="exp" readonly>${h(btoa(unescape(encodeURIComponent(E.serialize(S)))))}</textarea><button class="btn sm" data-act="copyexp">Copier</button></div>
      <div><span class="label">Importer</span><br><span class="muted">Collez une sauvegarde exportée. Elle remplace la partie actuelle.</span><textarea id="imp" placeholder="Collez la sauvegarde ici"></textarea><button class="btn sm" data-act="import">Importer</button> <span id="impmsg" class="minus"></span></div>
      <div><span class="label">Nouvelle partie</span><br>${ui.confirm === "reset" ? `<span class="minus">Toute la progression sera effacée.</span> <button class="btn sm danger" data-act="reset">Effacer et recommencer</button> <button class="btn sm" data-act="cancelreset">Annuler</button>` : `<button class="btn sm danger" data-act="askreset">Recommencer depuis le début</button>`}</div>
      <p class="note">Version 1 · Données de zones et monstres d'après les guides de la communauté, à vérifier sur DofusDB. Jeu de fan non officiel, sans lien avec Ankama.</p>
    </div>
    <div><button class="btn" data-act="closesheet">Fermer</button></div>`);
}
function offlineSheet(r) {
  const res = Object.entries(r.res).sort((a, b) => b[1] - a[1]);
  openSheet(`<h2>Pendant votre absence</h2>
    <p class="small">Absent ${dur(r.seconds)}. Votre équipe a continué à 25 % de son efficacité : <strong>${fmt(r.wins)}</strong> combats gagnés, <i class="kama"></i> <strong>+${fmt(r.kamas)}</strong> kamas${r.items ? `, ${r.items} objet${r.items > 1 ? "s" : ""}` : ""}.</p>
    ${r.lvls.length ? `<p class="small">${r.lvls.map(([n, a, b]) => `${h(n)} : niveau ${a} → ${b}`).join("<br>")}</p>` : ""}
    ${res.length ? `<div class="list small" style="max-height:240px;overflow:auto">${res.map(([n, q]) => `<div class="li"><span class="grow">${h(n)}</span><span class="num">+${fmt(q)}</span></div>`).join("")}</div>` : ""}
    <div><button class="btn primary" data-act="closesheet">Continuer</button></div>`);
}

/* ---------- Rendu général ---------- */
function render() {
  if (!S) return renderStart();
  renderNav();
  $("#kamas").textContent = fmt(S.kamas);
  if (ui.tab === "combat") renderCombat();
  else if (ui.tab === "equipe") renderTeam();
  else if (ui.tab === "sac") renderBag();
  else if (ui.tab === "ateliers") renderWorkshop();
  else renderMap();
}
function toast(txt, kind) {
  const box = $("#toasts"); const d = document.createElement("div");
  d.className = "toast " + (kind === "rare" ? "rare" : ""); d.textContent = txt; box.prepend(d);
  while (box.children.length > 3) box.lastChild.remove();
  setTimeout(() => d.remove(), kind === "rare" ? 6000 : 3500);
}
const msg = (r) => { if (typeof r === "string") toast(r); };

/* ---------- Actions ---------- */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-tab],[data-act]"); if (!t) return;
  if (t.dataset.tab) { ui.tab = t.dataset.tab; ui.slot = null; ui.confirm = null; render(); window.scrollTo(0, 0); return; }
  const a = t.dataset.act;
  if (a === "closesheet") { if (t.classList.contains("sheet-bg") && ev.target !== t) return; closeSheet(); render(); return; }
  if (t.tagName === "SELECT") return;
  const d = t.dataset; const c = ui.cid ? char(ui.cid) : null;
  switch (a) {
    case "startcls": ui.startCls = d.cls; if (!S) renderStart(); else { document.querySelectorAll(".sheet [data-act=startcls]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cls === d.cls)); } return;
    case "startgame": { const name = ($("#startName").value || "").trim() || "Aventurier"; S = E.newState(name.slice(0, 20), ui.startCls); ui.cid = S.chars[0].id; E.note(S, `${name} arrive sur Incarnam.`, "info"); dirty = true; saveNow(); render(); return; }
    case "speed": S.settings.speed = +d.v; break;
    case "leavedg": E.leaveDungeon(S); break;
    case "options": ui.confirm = null; optionsSheet(); return;
    case "selchar": ui.cid = +d.id; ui.slot = null; break;
    case "chartab": ui.charTab = d.v; ui.slot = null; break;
    case "toggleteam": msg(E.toggleTeam(S, +d.id)); break;
    case "alloc": E.allocate(S, c.id, d.k, +d.n); break;
    case "resetpts": E.resetPoints(S, +d.id); break;
    case "slot": ui.slot = d.slot || null; break;
    case "equip": msg(E.equip(S, c.id, +d.uid, ui.slot)); ui.slot = null; break;
    case "unequip": E.unequip(S, c.id, d.slot); ui.slot = null; break;
    case "spup": case "spdown": { const i = +d.i, j = a === "spup" ? i - 1 : i + 1; [c.spells[i], c.spells[j]] = [c.spells[j], c.spells[i]]; break; }
    case "sprem": c.spells.splice(+d.i, 1); break;
    case "spadd": if (c.spells.length < 6) c.spells.push({ id: d.id, cond: "always" }); break;
    case "recruitsheet": recruitSheet(); return;
    case "recruit": { const r = E.recruit(S, ui.startCls, ($("#recName").value || "").trim().slice(0, 20)); if (r) { toast(r); return; } closeSheet(); ui.cid = S.chars[S.chars.length - 1].id; break; }
    case "bagtab": ui.bagTab = d.v; break;
    case "givesheet": giveSheet(+d.uid); return;
    case "giveto": { const r = E.equip(S, +d.id, ui.giveTo); if (r) { toast(r); return; } closeSheet(); toast("Objet équipé."); break; }
    case "sellitem": { const p = E.sellItem(S, +d.uid); if (p) toast(`Vendu pour ${fmt(p)} kamas.`); break; }
    case "sellres": { const p = E.sellRes(S, d.n, +d.q); if (p) toast(`Vendu pour ${fmt(p)} kamas.`); break; }
    case "atetab": ui.ateTab = d.v; ui.confirm = null; break;
    case "craftjob": ui.craftJob = d.v; break;
    case "craft": { const r = d.tpl ? E.craftItem(S, d.tpl) : E.craftSpecial(S, d.special);
      if (typeof r === "string") toast(r); else if (r && r.uid) toast(`Fabriqué : ${ITEMS[r.tpl].name} (jet ${Math.round(E.itemQuality(r) * 100)} %)`); else toast(`Fabriqué : ${d.special}`); break; }
    case "break": { const r = E.breakItem(S, +d.uid, ui.focus || null); if (typeof r === "string") toast(r); else toast("Runes : " + (Object.entries(r).map(([k, q]) => `${E.runeName(k)} ×${q}`).join(", ") || "aucune")); break; }
    case "askbreakall": ui.confirm = "breakall"; break;
    case "cancel": ui.confirm = null; break;
    case "breakall": { let n = 0; Object.values(S.items).forEach((it) => { if (!E.equippedBy(S, it.uid)) { E.breakItem(S, it.uid, ui.focus || null); n++; } }); ui.confirm = null; toast(`${n} objets brisés.`); break; }
    case "feed": { const r = E.feedRune(S, d.k, +d.q); if (r) toast(`+${fmt(r.xp)} XP d'Emblème${r.gained ? `, +${r.gained} ${STATS[E.runeInfo(d.k).stat].short}` : ""}`); break; }
    case "askline": ui.confirm = "line:" + d.k; break;
    case "remline": E.removeEmblemLine(S, d.k); ui.confirm = null; break;
    case "perk": E.choosePerk(S, +d.t, d.id); break;
    case "gosub": if (S.dungeon) { toast("Quittez d'abord le donjon."); return; } E.setSub(S, d.id); ui.tab = "combat"; break;
    case "enterdg": { const r = E.enterDungeon(S, d.id); if (r) { toast(r); return; } ui.tab = "combat"; break; }
    case "savenow": saveNow(true); return;
    case "copyexp": { const ta = $("#exp"); try { navigator.clipboard.writeText(ta.value).then(() => toast("Sauvegarde copiée."), () => { ta.select(); toast("Sélectionnez puis copiez le texte."); }); } catch (e) { ta.select(); } return; }
    case "import": { try { const txt = decodeURIComponent(escape(atob($("#imp").value.trim()))); const N = E.deserialize(txt); S = N; ui.cid = S.chars[0].id; dirty = true; saveNow(); closeSheet(); toast("Sauvegarde importée."); } catch (e) { $("#impmsg").textContent = "Ce texte n'est pas une sauvegarde valide."; return; } break; }
    case "askreset": ui.confirm = "reset"; optionsSheet(); return;
    case "cancelreset": ui.confirm = null; optionsSheet(); return;
    case "reset": S = null; ui.confirm = null; closeSheet(); try { localStorage.removeItem(LS_KEY); } catch (e) {} if (cloud) cloud.ref.delete().catch(() => {}); render(); return;
    default: return;
  }
  dirty = true; render();
});
document.addEventListener("change", (ev) => {
  const t = ev.target; const a = t.dataset.act; if (!a || !S) return;
  const c = ui.cid ? char(ui.cid) : null;
  if (a === "autostat") { const x = char(+t.dataset.id); x.autoStat = t.value || null; E.autoAllocate(S, x); }
  else if (a === "spcond") c.spells[+t.dataset.i].cond = t.value;
  else if (a === "slotfilter") ui.slotFilter = t.value;
  else if (a === "gather") { S.jobs[t.dataset.job].target = t.value; S.jobs[t.dataset.job].prog = 0; }
  else if (a === "focus") ui.focus = t.value;
  else return;
  dirty = true; render();
});

/* ---------- Sauvegarde (cloud privé si disponible, sinon navigateur) ---------- */
let dirty = false, cloud = null, saving = false, lastSaveOk = 0, saveErr = "";
function saveStatus() {
  const when = lastSaveOk ? new Date(lastSaveOk).toLocaleTimeString("fr-FR") : "jamais";
  return (cloud ? "Sauvegardée dans votre compte (PC et mobile)" : "Sauvegardée dans ce navigateur uniquement : utilisez l'export pour changer d'appareil") + ` · dernière sauvegarde : ${when}${saveErr ? " · " + saveErr : ""}`;
}
async function saveNow(manual) {
  if (!S || saving) return; saving = true; S.savedAt = Date.now(); S.lastTick = Date.now();
  const txt = E.serialize(S);
  try { localStorage.setItem(LS_KEY, txt); } catch (e) {}
  if (cloud) {
    try { await cloud.ref.set({ save: txt, savedAt: S.savedAt }); saveErr = ""; }
    catch (e) { saveErr = "échec de la sauvegarde en ligne"; if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) cloud = null; }
  }
  lastSaveOk = Date.now(); dirty = false; saving = false;
  if (manual) toast("Partie sauvegardée.");
}
async function loadSave() {
  let local = null, remote = null;
  try { const t = localStorage.getItem(LS_KEY); if (t) local = E.deserialize(t); } catch (e) {}
  try {
    const claude = window.claude;
    if (claude && claude.use) {
      const timeout = new Promise((r) => setTimeout(() => r([null, null]), 4000));
      const [db, user] = await Promise.race([Promise.all([claude.use("db"), claude.use("user")]), timeout]);
      const uid = user ? await user.id() : null;
      if (db && uid) {
        const ref = db.doc("data/users/" + uid + "/save");
        cloud = { ref };
        const snap = await ref.get();
        if (snap.exists && snap.data().save) remote = E.deserialize(snap.data().save);
      }
    }
  } catch (e) { cloud = null; }
  if (local && remote) return (remote.savedAt || 0) >= (local.savedAt || 0) ? remote : local;
  return remote || local;
}

/* ---------- Boucle ---------- */
let last = performance.now(), sinceSave = 0, sinceView = 0;
function loop() {
  const now = performance.now(); let dt = Math.min(now - last, 5000); last = now;
  if (S) {
    E.tick(S, dt); S.lastTick = Date.now();
    sinceSave += dt; sinceView += dt;
    if (E.events.length) { E.events.splice(0).forEach((ev) => { if (ev.kind === "rare" || ev.kind === "up" || ev.kind === "loot") toast(ev.txt, ev.kind); }); dirty = true; }
    $("#kamas").textContent = fmt(S.kamas);
    if (ui.tab === "combat") updateCombat(false);
    else if (ui.tab === "ateliers" && ui.ateTab === "recolte") {
      document.querySelectorAll("[data-gprog]").forEach((b) => { const s = S.jobs[b.dataset.gprog]; b.firstElementChild.style.width = pct(s.prog, E.gatherTime(s.lvl)) + "%"; });
      if (sinceView > 3000 && !isEditing()) { sinceView = 0; renderWorkshop(); }
    }
    if (sinceSave > 20000) { sinceSave = 0; dirty = true; saveNow(); }
  }
  setTimeout(loop, 200);
}
const isEditing = () => { const a = document.activeElement; return a && (a.tagName === "SELECT" || a.tagName === "INPUT" || a.tagName === "TEXTAREA"); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(); else if (S) { const gap = (Date.now() - (S.lastTick || Date.now())) / 1000; if (gap > 60) { const r = E.catchUp(S, gap); if (r && r.wins) offlineSheet(r); } last = performance.now(); } });

async function start(hotData) {
  renderNav();
  if (hotData && hotData.save) { try { S = E.deserialize(hotData.save); } catch (e) { S = null; } }
  if (!S) S = await loadSave();
  if (S) {
    ui.cid = S.chars[0].id;
    const gap = (Date.now() - (S.lastTick || Date.now())) / 1000;
    const r = gap > 60 ? E.catchUp(S, gap) : null;
    render();
    if (r && (r.wins || Object.keys(r.res).length)) offlineSheet(r);
  } else render();
  loop();
}
try { window.claude?.hot?.snapshot?.(() => (S ? { save: E.serialize(S) } : {})); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
