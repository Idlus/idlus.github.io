# Serveur OVH : installe et entretient le futur serveur en ligne d'Idlus (Supabase auto-hébergé sur le VPS OVH de Mathis).
# Lancé uniquement à la main : Actions > Serveur OVH > Run workflow. Ne touche pas au serveur Supabase actuel ni au jeu.
# Secrets (ajoutés par Mathis, jamais écrits ailleurs) : VPS_HOST (adresse IP), VPS_USER (utilisateur), VPS_PASSWORD (mot de passe).
# Étapes :
#   verifier  : se connecte et affiche la machine (système, processeurs, mémoire, disque)
#   installer : installe ou met à jour Supabase + HTTPS + pare-feu + sauvegarde de nuit (tools/serveur/installer.sh)
#   copier    : copie l'ancienne base Supabase (accès en lecture seule) et la charge dans le nouveau serveur, à la place
#               de ce qu'il contient (tools/serveur/copier.sh puis restaurer.sh). Secret : SUPABASE_ACCESS_TOKEN.
#   bascule   : coupe l'accès du jeu à l'ancien serveur Supabase (son API ne montre plus les tables du jeu : plus aucune
#               lecture ni écriture des joueurs), puis fait la copie finale. Accord écrit de Mathis (14/10/2026).
#   rouvrir   : rend l'accès du jeu à l'ancien serveur (retour en arrière).
#   diagnostic: lecture seule : état des services, journaux récents du direct (Realtime), joueurs connectés récemment.
#   couper-boucle : supprime la seule session qui renouvelle son jeton en boucle (tools/serveur/couper_boucle.sql, plus de
#               200 renouvellements en 10 minutes). Accord écrit de Mathis (14/10/2026).
#   guildes-zero-essai : 1.0.30, remise à zéro des guildes À BLANC (tools/serveur/guildes_reset.sql) : affiche les guildes
#               dissoutes, les envois de compensation et le code GUILDES, puis annule tout. Après « Serveur en ligne ».
#   guildes-zero : la même chose pour de vrai (une seule fois : le script refuse si le code GUILDES existe déjà).
#               Accord écrit de Mathis (14/10/2026, « lance la remise à zéro des guildes »).
#   soft-reset-comptage : 1.0.30, lecture seule : combien de parties et d'objets le soft reset des jets toucherait
#               (tools/soft_reset_compte.js). Seuls des totaux et des pseudos sont affichés, jamais les parties.
#               Accord écrit de Mathis (14/10/2026, « fais le comptage du soft reset »).
#   compensation-fm-essai : 1.0.30.1, À BLANC : qui recevrait combien de kamas en plus pour la forgemagie retirée par le soft
#               reset (tools/compensation_fm.js), puis annule tout.
#   compensation-fm : la même chose pour de vrai (une seule fois : refusé si elle a déjà été envoyée). Avec les mots de Mathis.
# domaine : adresse du serveur (ex. api.idlus.fr). Vide = adresse gratuite <ip>.sslip.io.
name: Serveur OVH
on:
  workflow_dispatch:
    inputs:
      etape:
        description: "Étape"
        type: choice
        options: [verifier, installer, copier, bascule, rouvrir, diagnostic, couper-boucle, guildes-zero-essai, guildes-zero, soft-reset-comptage, compensation-fm-essai, compensation-fm, fonctions-limites, wb-retrait-essai, wb-retrait, maitrise-reset-essai, maitrise-reset, bouclier-diagnostic, triche-tour, enquete-joueur, restaurer-justever-essai, restaurer-justever, monocompte-installer, monocompte-remise-zero, monocompte-maj, monocompte-panel, monocompte-fonction, monocompte-separation, monocompte-bouclier-etat, monocompte-social, rendre-xp-metier-essai, rendre-xp-metier]
        default: verifier
      pseudo:
        description: "Pseudo du joueur (étapes enquete-joueur et rendre-xp-metier)"
        type: string
        default: ""
      domaine:
        description: "Domaine du serveur (vide = <ip>.sslip.io)"
        type: string
        default: ""
concurrency:
  group: serveur-ovh
  cancel-in-progress: false
jobs:
  serveur:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Préparation
        env:
          S_PASS: ${{ secrets.VPS_PASSWORD }}
          S_HOTE: ${{ secrets.VPS_HOST }}
          S_UTIL: ${{ secrets.VPS_USER }}
          S_NOUV: ${{ secrets.VPS_NEW_PASSWORD }}
        run: |
          for s in S_HOTE S_UTIL S_PASS; do if [ -z "${!s}" ]; then echo "Secret manquant (VPS_HOST, VPS_USER ou VPS_PASSWORD)." >&2; exit 1; fi; done
          # Espaces ou retours à la ligne copiés par erreur autour des valeurs : on les enlève
          h=$(printf '%s' "$S_HOTE" | tr -d '[:space:]'); u=$(printf '%s' "$S_UTIL" | tr -d '[:space:]'); p=$(printf '%s' "$S_PASS" | tr -d '\r\n')
          for v in "$h" "$u" "$p"; do echo "::add-mask::$v"; done
          if ! echo "$h" | grep -qE '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then echo "VPS_HOST ne ressemble pas à une adresse IPv4 (4 nombres séparés par des points)." >&2; exit 1; fi
          if ! echo "$u" | grep -qE '^[a-z_][a-z0-9_-]{0,31}$'; then echo "VPS_USER doit être un nom d'utilisateur du serveur (ex. ubuntu), pas une adresse e-mail (${#u} caractères)." >&2; exit 1; fi
          n=$(printf '%s' "$S_NOUV" | tr -d '\r\n'); [ -n "$n" ] && echo "::add-mask::$n"
          { echo "HOTE=$h"; echo "UTIL=$u"; echo "SSHPASS=$p"; echo "NOUV=$n"; } >> "$GITHUB_ENV"
          sudo apt-get -qq install -y sshpass expect >/dev/null
          echo "SSHO=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20" >> "$GITHUB_ENV"
      - name: Mot de passe (premier changement imposé par OVH)
        run: |
          # OVH impose de changer le mot de passe à la première connexion. Si le secret VPS_NEW_PASSWORD existe :
          # on essaie d'abord le nouveau mot de passe ; sinon on se connecte avec l'ancien et on le remplace par le nouveau.
          [ -n "$NOUV" ] || exit 0
          if SSHPASS="$NOUV" sshpass -e ssh $SSHO "$UTIL@$HOTE" true 2>/dev/null; then echo "Nouveau mot de passe déjà en place."; echo "SSHPASS=$NOUV" >> "$GITHUB_ENV"; exit 0; fi
          cat > /tmp/mdp.exp <<'EXP'
          # sleep avant chaque envoi : sinon le terminal du serveur efface ce qui arrive avant que l'invite soit prête
          set timeout 40
          spawn ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o PubkeyAuthentication=no $env(UTIL)@$env(HOTE)
          expect {
            -nocase -re "current.*password:" { sleep 1; send -- "$env(SSHPASS)\r"; exp_continue }
            -nocase -re "retype new password:" { sleep 1; send -- "$env(NOUV)\r"; exp_continue }
            -nocase -re "new password:" { sleep 1; send -- "$env(NOUV)\r"; exp_continue }
            -nocase -re "password:" { sleep 1; send -- "$env(SSHPASS)\r"; exp_continue }
            -nocase -re "successfully|updated successfully" { exp_continue }
            -nocase -re "bad password|do not match|failure|unchanged" { puts "\nCHANGEMENT_REFUSE"; exit 2 }
            eof
          }
          EXP
          expect /tmp/mdp.exp > /tmp/mdp.log 2>&1 || true
          grep -v -F -e "$SSHPASS" -e "$NOUV" /tmp/mdp.log | tail -5 || true
          if SSHPASS="$NOUV" sshpass -e ssh $SSHO "$UTIL@$HOTE" true 2>/dev/null; then echo "Mot de passe changé."; echo "SSHPASS=$NOUV" >> "$GITHUB_ENV"; else echo "Le changement de mot de passe n'a pas marché (nouveau mot de passe trop simple ?)." >&2; exit 1; fi
      - name: Connexion et machine
        run: |
          out=$(sshpass -e ssh $SSHO "$UTIL@$HOTE" 'echo CONNEXION_OK; . /etc/os-release; echo "Système : $PRETTY_NAME"; echo "Processeurs : $(nproc)"; free -h | sed -n 2p | awk "{print \"Mémoire : \" \$2 \" (utilisée \" \$3 \")\"}"; df -h / | tail -1 | awk "{print \"Disque : \" \$2 \" (libre \" \$4 \")\"}"; uptime' 2>&1) || true
          echo "$out"
          if ! echo "$out" | grep -q CONNEXION_OK; then
            if echo "$out" | grep -qi "expired\|change your password"; then echo "OVH demande de changer le mot de passe à la première connexion : à faire une fois (voir le fil)." >&2; fi
            echo "Connexion impossible (adresse, utilisateur ou mot de passe ?)." >&2; exit 1
          fi
      - name: Installation
        if: inputs.etape == 'installer'
        env:
          DOMAINE_DEMANDE: ${{ inputs.domaine }}
          D_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          D_SECRET: ${{ secrets.DISCORD_SECRET }}
        run: |
          dom="$DOMAINE_DEMANDE"; [ -n "$dom" ] || dom="$(echo "$HOTE" | tr . -).sslip.io"
          if ! echo "$dom" | grep -qE '^[a-z0-9.-]+$'; then echo "Domaine invalide : $dom" >&2; exit 1; fi
          echo "Domaine : $dom"
          sshpass -e ssh $SSHO "$UTIL@$HOTE" 'rm -rf /tmp/idlus-serveur && mkdir -p /tmp/idlus-serveur'
          sshpass -e scp $SSHO tools/serveur/* "$UTIL@$HOTE:/tmp/idlus-serveur/"
          # Connexion Discord (si les secrets existent) : petit fichier privé, lu puis effacé par installer.sh
          if [ -n "$D_ID" ] && [ -n "$D_SECRET" ]; then
            (umask 077; printf 'D_ID=%q\nD_SECRET=%q\n' "$D_ID" "$D_SECRET" > /tmp/discord.env)
            sshpass -e scp $SSHO /tmp/discord.env "$UTIL@$HOTE:/tmp/idlus-serveur/discord.env"; rm -f /tmp/discord.env
          fi
          if [ "$UTIL" = "root" ]; then
            sshpass -e ssh $SSHO "root@$HOTE" "bash /tmp/idlus-serveur/installer.sh '$dom'"
          else
            # sudo lit le mot de passe sur la première ligne (jamais affiché)
            printf '%s\n' "$SSHPASS" | sshpass -e ssh $SSHO "$UTIL@$HOTE" "sudo -S -p '' bash /tmp/idlus-serveur/installer.sh '$dom'"
          fi
      - name: Accès du jeu à l'ancien serveur (couper ou rouvrir)
        if: inputs.etape == 'bascule' || inputs.etape == 'rouvrir'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: bolbuxuxydfslwpfbfff
          ETAPE: ${{ inputs.etape }}
        run: |
          # Réglage de l'API de l'ancien Supabase (pas de la base) : schémas visibles par le jeu. « public » retiré = le jeu ne
          # peut plus rien lire ni écrire ; remis = retour comme avant. Les données ne sont pas touchées.
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/postgrest"; H=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          echo "Avant : $(curl -sS -m 60 "$api" "${H[@]}" | jq -c '{db_schema}')"
          if [ "$ETAPE" = rouvrir ]; then v="public, graphql_public"; else v="graphql_public"; fi
          r=$(curl -sS -m 60 -X PATCH "$api" "${H[@]}" --data "$(jq -nc --arg v "$v" '{db_schema: $v}')")
          echo "Après : $(echo "$r" | jq -c '{db_schema}' 2>/dev/null || echo "$r" | head -c 300)"
          [ "$(echo "$r" | jq -r '.db_schema // empty')" = "$v" ] || { echo "Réglage refusé." >&2; exit 1; }
          sleep 20
          code=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" "https://$PROJECT_REF.supabase.co/rest/v1/lb_level?select=pts&limit=1" -H "apikey: sb_publishable__Kojf1wLJLnbi3eqquQ_8g_AR6lVP9H")
          echo "Lecture du classement par le jeu sur l'ancien serveur : HTTP $code"
      - name: Copie de l'ancienne base vers le nouveau serveur
        if: inputs.etape == 'copier' || inputs.etape == 'bascule'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: bolbuxuxydfslwpfbfff
        run: |
          sudo apt-get -qq install -y postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null 2>&1
          sudo apt-get -qq install -y postgresql-client-17 >/dev/null
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          trap 'rm -rf /tmp/copie' EXIT
          bash tools/serveur/copier.sh /tmp/copie
          sshpass -e ssh $SSHO "$UTIL@$HOTE" 'rm -rf /tmp/idlus-serveur /tmp/idlus-copie && mkdir -p /tmp/idlus-serveur /tmp/idlus-copie && chmod 700 /tmp/idlus-copie'
          sshpass -e scp $SSHO tools/serveur/* "$UTIL@$HOTE:/tmp/idlus-serveur/"
          sshpass -e scp $SSHO /tmp/copie/* "$UTIL@$HOTE:/tmp/idlus-copie/"
          if [ "$UTIL" = "root" ]; then
            sshpass -e ssh $SSHO "root@$HOTE" "bash /tmp/idlus-serveur/restaurer.sh /tmp/idlus-copie"
          else
            printf '%s\n' "$SSHPASS" | sshpass -e ssh $SSHO "$UTIL@$HOTE" "sudo -S -p '' bash /tmp/idlus-serveur/restaurer.sh /tmp/idlus-copie"
          fi
      - name: Limites de calcul des fonctions (Boss des mondes, Kolizéum…)
        if: inputs.etape == 'fonctions-limites'
        run: bash tools/serveur/vps_sql.sh commande "$(cat tools/serveur/fonctions_limites.sh)"
      - name: Couper la session qui se renouvelle en boucle
        if: inputs.etape == 'couper-boucle'
        run: bash tools/serveur/vps_sql.sh fichier tools/serveur/couper_boucle.sql
      - name: Remise à zéro des guildes (essai, rien n'est changé)
        if: inputs.etape == 'guildes-zero-essai'
        run: bash tools/serveur/vps_sql.sh fichier tools/serveur/guildes_reset.sql
      - name: Remise à zéro des guildes (pour de vrai)
        if: inputs.etape == 'guildes-zero'
        run: |
          f="$RUNNER_TEMP/guildes_reset.sql"
          sed "s/^\\\\set CONFIRMATION 'non'$/\\\\set CONFIRMATION 'JE DISSOUS TOUTES LES GUILDES'/" tools/serveur/guildes_reset.sql > "$f"
          grep -qx "\\\\set CONFIRMATION 'JE DISSOUS TOUTES LES GUILDES'" "$f" || { echo "Ligne CONFIRMATION introuvable : rien n'est lancé." >&2; exit 1; }
          bash tools/serveur/vps_sql.sh fichier "$f"
      - name: Boss des mondes, essais du bug du Dom de Pin (essai, rien n'est changé)
        if: inputs.etape == 'wb-retrait-essai'
        run: bash tools/serveur/vps_sql.sh fichier tools/serveur/wb_retrait_bug.sql
      - name: Boss des mondes, retrait des essais du bug du Dom de Pin (pour de vrai, choix 3B de Mathis)
        if: inputs.etape == 'wb-retrait'
        run: |
          f="$RUNNER_TEMP/wb_retrait_bug.sql"
          sed "s/^\\\\set CONFIRMATION 'non'$/\\\\set CONFIRMATION 'RETIRE LES ESSAIS DU BUG'/" tools/serveur/wb_retrait_bug.sql > "$f"
          grep -qx "\\\\set CONFIRMATION 'RETIRE LES ESSAIS DU BUG'" "$f" || { echo "Ligne CONFIRMATION introuvable : rien n'est lancé." >&2; exit 1; }
          bash tools/serveur/vps_sql.sh fichier "$f"
      - name: JustEver remis à sa copie du 17/10 (essai, rien n'est changé)
        if: inputs.etape == 'restaurer-justever-essai'
        run: bash tools/serveur/vps_sql.sh fichier tools/serveur/restaurer_justever.sql
      - name: JustEver remis à sa copie du 17/10 (pour de vrai, demande écrite de Mathis du 18/10)
        if: inputs.etape == 'restaurer-justever'
        run: |
          f="$RUNNER_TEMP/restaurer_justever.sql"
          sed "s|^\\\\set CONFIRMATION 'non'$|\\\\set CONFIRMATION 'REMETS JUSTEVER AU 17/10'|" tools/serveur/restaurer_justever.sql > "$f"
          grep -qx "\\\\set CONFIRMATION 'REMETS JUSTEVER AU 17/10'" "$f" || { echo "Ligne CONFIRMATION introuvable : rien n'est lancé." >&2; exit 1; }
          bash tools/serveur/vps_sql.sh fichier "$f"
      - name: Maîtrise retirée des classements (essai, rien n'est changé)
        if: inputs.etape == 'maitrise-reset-essai'
        run: bash tools/serveur/vps_sql.sh fichier tools/serveur/maitrise_reset.sql
      - name: Maîtrise retirée des classements (pour de vrai, choix 5A de Mathis)
        if: inputs.etape == 'maitrise-reset'
        run: |
          f="$RUNNER_TEMP/maitrise_reset.sql"
          sed "s/^\\\\set CONFIRMATION 'non'$/\\\\set CONFIRMATION 'RESET DES MAITRISES'/" tools/serveur/maitrise_reset.sql > "$f"
          grep -qx "\\\\set CONFIRMATION 'RESET DES MAITRISES'" "$f" || { echo "Ligne CONFIRMATION introuvable : rien n'est lancé." >&2; exit 1; }
          bash tools/serveur/vps_sql.sh fichier "$f"
      - name: Comptage du soft reset des jets (lecture seule)
        if: inputs.etape == 'soft-reset-comptage'
        run: |
          f="$RUNNER_TEMP/parties.json"
          bash tools/serveur/vps_sql.sh lecture "select s.user_id, public.pseudo_of(s.user_id) as pseudo, s.data from public.saves s" > "$f"
          node tools/soft_reset_compte.js "$f"
          rm -f "$f"
      - name: Compensation forgemagie en kamas (essai ou pour de vrai)
        if: inputs.etape == 'compensation-fm-essai' || inputs.etape == 'compensation-fm'
        run: |
          f="$RUNNER_TEMP/parties.json"; q="$RUNNER_TEMP/compensation_fm.sql"
          bash tools/serveur/vps_sql.sh lecture "select s.user_id, public.pseudo_of(s.user_id) as pseudo, s.data from public.saves s" > "$f"
          node tools/compensation_fm.js "$f" "$q" $([ "${{ inputs.etape }}" = compensation-fm ] && echo --appliquer)
          rm -f "$f"
          bash tools/serveur/vps_sql.sh fichier "$q"
      - name: XP de paysan rendue (essai ou pour de vrai, demande écrite de Mathis du 22/10, ticket #146)
        if: inputs.etape == 'rendre-xp-metier-essai' || inputs.etape == 'rendre-xp-metier'
        env:
          PSEUDO: ${{ inputs.pseudo }}
        run: |
          p=$(printf '%s' "$PSEUDO" | tr -cd 'A-Za-z0-9_-'); [ -n "$p" ] || { echo "Pseudo manquant." >&2; exit 1; }
          f="$RUNNER_TEMP/rendre_xp_metier.sql"
          sed "s|^\\\\set PSEUDO ''$|\\\\set PSEUDO '$p'|" tools/serveur/rendre_xp_metier.sql > "$f"
          grep -qx "\\\\set PSEUDO '$p'" "$f" || { echo "Ligne PSEUDO introuvable : rien n'est lancé." >&2; exit 1; }
          if [ "${{ inputs.etape }}" = rendre-xp-metier ]; then
            sed -i "s|^\\\\set CONFIRMATION 'non'$|\\\\set CONFIRMATION 'RENDS L XP DE METIER'|" "$f"
            grep -qx "\\\\set CONFIRMATION 'RENDS L XP DE METIER'" "$f" || { echo "Ligne CONFIRMATION introuvable : rien n'est lancé." >&2; exit 1; }
            echo "Sauvegarde complète de la base avant l'envoi :"
            bash tools/serveur/vps_sql.sh commande "/opt/idlus/sauvegarde.sh"
          fi
          bash tools/serveur/vps_sql.sh fichier "$f"
      - name: Enquête sur un joueur (lecture seule, demande de Mathis)
        if: inputs.etape == 'enquete-joueur'
        env:
          PSEUDO: ${{ inputs.pseudo }}
        run: |
          # 18/10/2026 : « Just ever triche ? vérifie ça sauvegarde » (Mathis). Lecture seule ; le journal n'affiche que des chiffres de jeu
          # (tools/enquete_joueur.js), jamais la partie : le relevé reste dans le dossier temporaire de l'action et il est effacé.
          p=$(printf '%s' "$PSEUDO" | tr -cd 'A-Za-z0-9_-'); [ -n "$p" ] || { echo "Pseudo manquant." >&2; exit 1; }
          f="$RUNNER_TEMP/releve.json"
          bash tools/serveur/vps_sql.sh lecture "select p.pseudo, p.created_at as cree, s.data as save, s.updated_at as save_at,
            (select row_to_json(x) from (select l.suspect, l.flagged, l.verified, l.flag_reason, l.level, l.playtime, l.updated_at from public.ladder l where l.user_id = p.id) x) as ladder,
            (select row_to_json(x) from (select o.bilan, o.res, o.src_at, o.at, o.accept from public.saves_ok o where o.user_id = p.id) x) as ok,
            (select o.data from public.saves_ok o where o.user_id = p.id) as ok_data,
            (select row_to_json(x) from (select k.w, k.cote, k.n, k.win, k.loss from public.koli k where k.user_id = p.id) x) as koli,
            (select coalesce(json_agg(x order by x.at desc), '[]') from (select b.why, b.at from public.bouclier_log b where b.user_id = p.id order by b.at desc limit 60) x) as bouclier,
            (select coalesce(json_agg(x), '[]') from (select g.code, g.at from public.gift_uses g where g.user_id = p.id order by g.at) x) as codes,
            (select coalesce(json_agg(x), '[]') from (select j.day, j.at, j.data from public.saves_jour j where j.user_id = p.id) x) as jours
            from public.profiles p left join public.saves s on s.user_id = p.id where lower(p.pseudo) = lower('$p')" > "$f"
          node tools/enquete_joueur.js "$f"
          rm -f "$f"
      - name: Tour des tricheurs possibles (lecture seule, Classique + Monocompte)
        # 28/10/2026 : « tu peux vérifier si y'a des tricheurs ? » puis « Oui, les 3 (lecture seule) » (Mathis). Seulement les bilans
        # calculés par le serveur (jamais le contenu d'une partie) ; comptes désignés par le début de leur identifiant, sans pseudo.
        if: inputs.etape == 'triche-tour'
        run: |
          echo '== CLASSIQUE'
          bash tools/serveur/vps_sql.sh lecture "select left(p.id::text, 8) id, round(extract(epoch from now() - p.created_at) / 3600) age_h,
            round((o.bilan->>'pt')::numeric, 1) jeu_h, (o.bilan->>'k')::bigint k, (o.bilan->>'r')::bigint r, (o.bilan->>'lv')::int lv, (o.bilan->>'rec')::int rec,
            (o.bilan->>'mt')::int mt, (o.bilan->>'dof')::int dof, (o.bilan->>'op')::bigint op, round(o.res::numeric, 1) res_h,
            round(extract(epoch from now() - o.at) / 3600, 1) valide_il_y_a_h, round(extract(epoch from now() - s.updated_at) / 3600, 1) envoi_il_y_a_h,
            l.suspect, l.flagged, l.verified, left(l.flag_reason, 80) raison, (p.suspended_at is not null) suspendu,
            (select count(*) from public.bouclier_log b where b.user_id = p.id and b.at > now() - interval '7 days') refus_7j,
            (select count(*) from public.bouclier_log b where b.user_id = p.id) refus_total,
            (select left(regexp_replace(b.why, '^[^:]{1,20} : ', '<héros> : '), 110) from public.bouclier_log b where b.user_id = p.id order by b.at desc limit 1) dernier_refus,
            (select max(b.at) from public.bouclier_log b where b.user_id = p.id) dernier_refus_at,
            (select count(*) from public.gift_uses g where g.user_id = p.id) codes
            from public.profiles p left join public.saves_ok o on o.user_id = p.id left join public.saves s on s.user_id = p.id left join public.ladder l on l.user_id = p.id
            where o.user_id is not null or l.user_id is not null order by k desc nulls last"
          echo '== MONOCOMPTE'
          bash tools/serveur/vps_sql.sh lecture "select left(o.user_id::text, 8) id, o.saison, round(extract(epoch from now() - p.created_at) / 3600) age_h,
            round((o.bilan->>'pt')::numeric, 1) jeu_h, (o.bilan->>'k')::bigint k, (o.bilan->>'r')::bigint r, (o.bilan->>'lv')::int lv, (o.bilan->>'mt')::int mt,
            (o.bilan->>'dof')::int dof, (o.bilan->>'op')::bigint op, (o.bilan->>'hon')::bigint hon, (o.bilan->>'phx')::int phx, round(o.res::numeric, 1) res_h,
            round(extract(epoch from now() - o.at) / 3600, 1) valide_il_y_a_h, round(extract(epoch from now() - m.updated_at) / 3600, 1) envoi_il_y_a_h,
            (select count(*) from mono.bouclier b where b.user_id = o.user_id and b.saison = o.saison) refus_total,
            (select count(*) from mono.bouclier b where b.user_id = o.user_id and b.saison = o.saison and b.at > now() - interval '7 days') refus_7j,
            (select left(regexp_replace(b.why, '^[^:]{1,20} : ', '<héros> : '), 110) from mono.bouclier b where b.user_id = o.user_id and b.saison = o.saison order by b.at desc limit 1) dernier_refus,
            (select coalesce(sum(v.n), 0) from mono.verifs v where v.user_id = o.user_id and v.etat = 'note') notes_7j
            from mono.parties_ok o join public.profiles p on p.id = o.user_id left join mono.parties m on m.user_id = o.user_id and m.saison = o.saison order by k desc nulls last"
          echo '== CLASSIQUE historique des refus (7 j, comptes refusés)'
          bash tools/serveur/vps_sql.sh lecture "select left(user_id::text, 8) id, regexp_replace(regexp_replace(why, '^[^:]{1,20} : ', '<héros> : '), '[0-9][0-9  ,.]*', '#', 'g') raison, count(*) n, min(at) premier, max(at) dernier, (array_agg(left(regexp_replace(why, '^[^:]{1,20} : ', '<héros> : '), 110) order by at))[1] exemple from public.bouclier_log where at > now() - interval '7 days' group by 1, 2 order by 1, 4"
          echo '== MONOCOMPTE refus sans partie validée'
          bash tools/serveur/vps_sql.sh lecture "select left(b.user_id::text, 8) id, b.saison, count(*) n, max(b.at) dernier from mono.bouclier b where not exists (select 1 from mono.parties_ok o where o.user_id = b.user_id and o.saison = b.saison) group by 1, 2 order by 3 desc"
      - name: Bouclier (lecture seule, sans pseudo)
        if: inputs.etape == 'bouclier-diagnostic'
        run: |
          echo "SSHO=$SSHO" >> "$GITHUB_ENV"
          echo '== Refus par heure (48 h)'
          bash tools/serveur/vps_sql.sh lecture "select date_trunc('hour', at) h, count(*) n, count(distinct user_id) comptes from public.bouclier_log where at > now() - interval '48 hours' group by 1 order by 1"
          echo '== Raisons (24 h, noms retirés)'
          bash tools/serveur/vps_sql.sh lecture "select regexp_replace(regexp_replace(why, '^[^:]{1,20} : ', '<héros> : '), '[0-9][0-9  ,.]*', '#', 'g') raison, count(*) n, count(distinct user_id) comptes, min(at) premier, max(at) dernier from public.bouclier_log where at > now() - interval '24 hours' group by 1 order by 2 desc limit 40"
          echo '== Comptes refusés (24 h, numérotés, sans pseudo)'
          bash tools/serveur/vps_sql.sh lecture "with b as (select user_id, count(*) n, max(at) dernier from public.bouclier_log where at > now() - interval '24 hours' group by 1), w as (select distinct on (user_id) user_id, why from public.bouclier_log where at > now() - interval '24 hours' order by user_id, at desc) select row_number() over (order by b.n desc) compte, b.n refus, w.why derniere_raison, round(extract(epoch from now() - o.at) / 3600) h_sans_validation, o.res reserve_h, o.bilan->>'lv' niveaux, o.bilan->>'k' kamas_valides, o.bilan->>'r' ressources_validees, l.suspect, l.flagged, l.verified from b join w using (user_id) left join public.saves_ok o using (user_id) left join public.ladder l using (user_id) order by b.n desc"
          echo '== Maîtrise : meilleurs héros (parties validées, sans pseudo)'
          bash tools/serveur/vps_sql.sh lecture "select (h->>'mt')::int mt, l.suspect, l.flagged, l.verified, round(extract(epoch from now() - o.at) / 3600) h_validee from public.ladder l join public.saves_ok o using (user_id), jsonb_array_elements(l.heroes) h where (h->>'mt') is not null order by 1 desc limit 25"
          echo '== Comptes retirés (sans pseudo)'
          bash tools/serveur/vps_sql.sh lecture "select row_number() over (order by l.user_id) compte, exists (select 1 from public.admins a where a.user_id = l.user_id) admin, o.at valide_a, o.src_at, o.accept, o.bilan is null bilan_vide, o.bilan->>'mt' mt_bilan, (select max(at) from public.bouclier_log b where b.user_id = l.user_id) dernier_refus, (select left(why, 120) from public.bouclier_log b where b.user_id = l.user_id order by at desc limit 1) derniere_raison, (select count(*) from public.saves_jour j where j.user_id = l.user_id) copies, s.updated_at envoi from public.ladder l left join public.saves_ok o using (user_id) left join public.saves s using (user_id) where l.flagged"
          echo '== Classement'
          bash tools/serveur/vps_sql.sh lecture "select count(*) filter (where suspect and not flagged) suspects, count(*) filter (where flagged) retires, count(*) filter (where verified) verifies, count(*) filter (where suspect and updated_at > now() - interval '24 hours') suspects_24h from public.ladder"
          echo '== Parties validées'
          bash tools/serveur/vps_sql.sh lecture "select (select count(*) from public.saves where updated_at > now() - interval '1 hour') envois_1h, (select count(*) from public.saves_ok where at > now() - interval '1 hour') valides_1h, (select count(*) from public.saves s join public.saves_ok o using (user_id) where s.updated_at > o.src_at + interval '30 minutes' and s.updated_at > now() - interval '2 hours') en_retard, (select max(at) from public.saves_ok) derniere_validation"
          bash tools/serveur/vps_sql.sh commande "echo '== Fonction record (2 h)'; docker logs --since 120m supabase-edge-functions 2>&1 | grep -iE 'error|erreur|exception|limit|timeout|boot' | tail -40"
      - name: Monocompte, lot 3 (sauvegarde de la base, 5 fichiers SQL, fonction « mono », saison de test)
        # 21/10/2026, ordre écrit de Mathis : « Installe le lot 3 Monocompte sur le serveur ». Lancé depuis la branche de la bêta.
        # Ne touche ni aux tables du Classique ni à la fonction « record ».
        if: inputs.etape == 'monocompte-installer'
        run: |
          echo "SSHO=$SSHO" >> "$GITHUB_ENV"
          echo '== Sauvegarde complète de la base avant installation'
          bash tools/serveur/vps_sql.sh commande 'set -euo pipefail; mkdir -p /opt/idlus/sauvegardes; f=/opt/idlus/sauvegardes/avant-monocompte-$(date +%Y-%m-%d-%H%M).sql.gz; docker exec supabase-db pg_dumpall -U postgres --clean --if-exists | gzip > $f.part; mv $f.part $f; ls -l $f; [ $(stat -c %s $f) -gt 100000 ] || { echo "sauvegarde trop petite" >&2; exit 1; }'
          for f in supabase/monocompte.sql supabase/amis.sql supabase/mono_social.sql supabase/mono_bureau.sql supabase/mono_cles.sql; do
            echo "== $f"
            { echo "set lock_timeout = '3s';"; cat "$f"; } > /tmp/q.sql
            for essai in 1 2 3 4 5 6; do
              if bash tools/serveur/vps_sql.sh fichier /tmp/q.sql > /tmp/r.txt 2>&1; then echo "OK (essai $essai)"; break; fi
              tail -c 800 /tmp/r.txt; echo
              if grep -qiE 'lock timeout|deadlock' /tmp/r.txt && [ "$essai" -lt 6 ]; then sleep $((essai * 10)); continue; fi
              exit 1
            done
          done
          node tools/build_server.js
          d=$(sshpass -e ssh $SSHO "$UTIL@$HOTE" 'mktemp -d /tmp/idlus-mono.XXXXXX')
          sshpass -e scp -q $SSHO supabase/functions/mono/index.ts supabase/functions/mono/game.js "$UTIL@$HOTE:$d/"
          bash tools/serveur/vps_sql.sh commande "set -e; mkdir -p volumes/functions/mono; cp $d/index.ts $d/game.js volumes/functions/mono/; rm -rf $d; docker compose restart functions >/dev/null; echo 'Fonction mono en place.'"
          echo '== Saison de test et testeurs'
          bash tools/serveur/vps_sql.sh fichier tools/serveur/monocompte_installer.sql
          sleep 15
          echo '== Fonctions record et mono (erreurs au démarrage)'
          bash tools/serveur/vps_sql.sh commande 'docker logs --since 3m supabase-edge-functions 2>&1 | grep -iE "error|erreur|exception|boot" | tail -20'
