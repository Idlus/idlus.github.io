# Publie chaque lundi matin le mutateur de la semaine dans #annonces sur Discord. Nécessite le secret DISCORD_BOT_TOKEN.
name: Mutateur de la semaine sur Discord
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
jobs:
  semaine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/discord_bot.js semaine
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
