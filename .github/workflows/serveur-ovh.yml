          # que des chiffres de jeu (tools/enquete_stasis.js), la partie reste dans le dossier temporaire et elle est effacée.
          p=$(printf '%s' "$PSEUDO" | tr -cd 'A-Za-z0-9_-'); [ -n "$p" ] || { echo "Pseudo manquant." >&2; exit 1; }
