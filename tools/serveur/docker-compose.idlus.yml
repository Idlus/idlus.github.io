# Réglages propres à Idlus, ajoutés par-dessus la configuration officielle de Supabase.
services:
  # La base n'est joignable que depuis le serveur lui-même (jamais depuis internet)
  supavisor:
    ports: !reset
      - 127.0.0.1:${POSTGRES_PORT}:5432
      - 127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543
  # Connexion avec Discord (valeurs remplies dans .env au moment du déménagement)
  auth:
    environment:
      GOTRUE_EXTERNAL_DISCORD_ENABLED: ${DISCORD_ENABLED}
      GOTRUE_EXTERNAL_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      GOTRUE_EXTERNAL_DISCORD_SECRET: ${DISCORD_SECRET}
      GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
