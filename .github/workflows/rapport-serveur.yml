# Rapport du serveur (à la demande) : donne les chiffres du serveur en ligne (joueurs, comptes, actifs du jour,
# taille de la base, mémoire, processeur, disque) en lecture seule, sans jamais afficher la clé ni une donnée personnelle.
# Serveur OVH depuis le déménagement (14/10/2026) : base lue par SSH (tools/serveur/vps_sql.sh).
# Lancement : onglet Actions > « Rapport du serveur » > Run workflow (ou Claude, sur demande dans le projet).
# Le rapport s'affiche dans le résumé de l'exécution et dans le journal de l'étape « Rapport ».
name: Rapport du serveur
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rapport-serveur
  cancel-in-progress: false
jobs:
  rapport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps
        with:
          hote: ${{ secrets.VPS_HOST }}
          util: ${{ secrets.VPS_USER }}
          pass: ${{ secrets.VPS_NEW_PASSWORD }}
      - name: Rapport
        run: |
          # Requête en lecture seule (la base refuse toute écriture de cette session).
          bash tools/serveur/vps_sql.sh lecture "$(cat tools/rapport_serveur.sql)" > /tmp/r.json
          # Machine du serveur OVH (mémoire, processeur, disque, services, dernière sauvegarde de nuit)
          bash tools/serveur/vps_sql.sh commande "$(cat tools/serveur/machine.sh)" > /tmp/m.json || echo '{}' > /tmp/m.json
          jq -n --slurpfile r /tmp/r.json --slurpfile m /tmp/m.json \
            '($r[0][0]) + {etat_serveur: "en ligne", region: "OVH"} + $m[0]' > rapport.json
          echo "== RAPPORT"; cat rapport.json
          {
            echo "## Rapport du serveur"
            echo
            echo "| Mesure | Valeur |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key | gsub("_"; " ")) | \(.value) |"' rapport.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-serveur
          path: rapport.json
          retention-days: 30
