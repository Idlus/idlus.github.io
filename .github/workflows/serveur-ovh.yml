        # Ne se lance que sur l'ordre écrit de Mathis (phrase d'installation de la Saison 1). Relançable : la date d'ouverture
        # n'est posée qu'une fois (si elle est vide). Ne touche à aucune table du Classique actuel (l'Éternel) : saison1.sql
        # crée le schéma s1 ; tournoi.sql ajoute le Tournoi des guildes dans public (nouvelles tables seulement).
        if: inputs.etape == 'saison1-installer'
        run: |
          echo "SSHO=$SSHO" >> "$GITHUB_ENV"
          echo '== Sauvegarde complète de la base avant installation'
          bash tools/serveur/vps_sql.sh commande 'set -euo pipefail; mkdir -p /opt/idlus/sauvegardes; f=/opt/idlus/sauvegardes/avant-saison1-$(date +%Y-%m-%d-%H%M).sql.gz; docker exec supabase-db pg_dumpall -U postgres --clean --if-exists | gzip > "$f"; ls -lh "$f"'
          for f in supabase/tournoi.sql supabase/saison1.sql; do
            echo "== $f"
            { echo "set lock_timeout = '3s';"; cat "$f"; } > /tmp/q.sql
            for essai in 1 2 3 4 5 6; do
              if bash tools/serveur/vps_sql.sh fichier /tmp/q.sql > /tmp/r.txt 2>&1; then echo "OK (essai $essai)"; break; fi
              tail -c 800 /tmp/r.txt; echo
              if grep -qiE 'lock timeout|deadlock' /tmp/r.txt && [ "$essai" -lt 6 ]; then sleep $((essai * 10)); continue; fi
              exit 1
            done
          done
          echo '== API : schéma s1 exposé (PGRST_DB_SCHEMAS), puis redémarrage de l API'
          bash tools/serveur/vps_sql.sh commande 'set -euo pipefail; v=$(grep "^PGRST_DB_SCHEMAS=" .env | cut -d= -f2-); case ",$v," in *,s1,*) echo "déjà : $v" ;; *) sed -i "s|^PGRST_DB_SCHEMAS=.*$|PGRST_DB_SCHEMAS=$v,s1|" .env; echo "avant : $v"; grep "^PGRST_DB_SCHEMAS=" .env ;; esac; docker compose up -d rest >/dev/null 2>&1; echo "API relancée"'
