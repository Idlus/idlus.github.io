        run: |
          # 18/10/2026 : « Just ever triche ? vérifie ça sauvegarde » (Mathis). Lecture seule ; le journal n'affiche que des chiffres de jeu
          # (tools/enquete_joueur.js), jamais la partie : le relevé reste dans le dossier temporaire de l'action et il est effacé.
          p=$(printf '%s' "$PSEUDO" | tr -cd 'A-Za-z0-9_-'); [ -n "$p" ] || { echo "Pseudo manquant." >&2; exit 1; }
          f="$RUNNER_TEMP/releve.json"
          bash tools/serveur/vps_sql.sh lecture "select p.pseudo, p.created_at as cree, s.data as save, s.updated_at as save_at,
            (select row_to_json(x) from (select l.suspect, l.flagged, l.verified, l.flag_reason, l.level, l.playtime, l.updated_at from public.ladder l where l.user_id = p.id) x) as ladder,
            (select row_to_json(x) from (select o.bilan, o.res, o.src_at, o.at, o.accept from public.saves_ok o where o.user_id = p.id) x) as ok,
            (select o.data from public.saves_ok o where o.user_id = p.id) as ok_data,
            (select row_to_json(x) from (select k.w, k.cote, k.n, k.win, k.loss from public.koli k where k.user_id = p.id) x) as koli,
            (select coalesce(json_agg(x order by x.at desc), '[]') from (select b.why, b.at from public.bouclier_log b where b.user_id = p.id order by b.at desc limit 60) x) as bouclier,
            (select coalesce(json_agg(x), '[]') from (select g.code, g.at from public.gift_uses g where g.user_id = p.id order by g.at) x) as codes,
            (select coalesce(json_agg(x), '[]') from (select j.day, j.at, j.data from public.saves_jour j where j.user_id = p.id) x) as jours
            from public.profiles p left join public.saves s on s.user_id = p.id where lower(p.pseudo) = lower('$p')" > "$f"
          node tools/enquete_joueur.js "$f"
          rm -f "$f"
      - name: Hauts faits par serveur, s1.chat_ann (sauvegarde de la base, supabase/chat_s1.sql, 2.2.4.9)
