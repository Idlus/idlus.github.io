# Rapport du serveur (à la demande) : donne les chiffres du serveur en ligne (joueurs, comptes, actifs du jour,
# taille de la base) en lecture seule, sans jamais afficher la clé ni une donnée personnelle.
# Lancement : onglet Actions > « Rapport du serveur » > Run workflow (ou Claude, sur demande dans le projet).
# Le rapport s'affiche dans le résumé de l'exécution et dans le journal de l'étape « Rapport ».
name: Rapport du serveur
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rapport-serveur
  cancel-in-progress: false
env:
  PROJECT_REF: bolbuxuxydfslwpfbfff
jobs:
  rapport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rapport
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN manquant." >&2; exit 1; fi
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"
          # Requête en lecture seule (read_only : la base refuse toute écriture).
          jq -Rs '{query: ., read_only: true}' tools/rapport_serveur.sql > /tmp/q.json
          code=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "$api/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          if [ "$code" -ge 300 ]; then echo "Erreur HTTP $code"; head -c 600 /tmp/r.json; echo; exit 1; fi
          # État du projet (nom, région, état) : aucune donnée de joueur.
          curl -sS "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -o /tmp/p.json || echo '{}' > /tmp/p.json
          jq -n --slurpfile r /tmp/r.json --slurpfile p /tmp/p.json \
            '($r[0][0]) + {etat_serveur: ($p[0].status // "?"), region: ($p[0].region // "?")}' > rapport.json
          echo "== RAPPORT"; cat rapport.json
          {
            echo "## Rapport du serveur"
            echo
            echo "| Mesure | Valeur |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key | gsub("_"; " ")) | \(.value) |"' rapport.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-serveur
          path: rapport.json
          retention-days: 30
