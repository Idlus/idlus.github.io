        run: |
          bash tools/serveur/vps_sql.sh lecture "select (select count(*) from mono.parties where updated_at > now() - interval '3 hours') parties_envoyees_3h, (select count(*) from mono.parties_ok where at > now() - interval '3 hours') parties_validees_3h, (select count(*) from mono.bouclier where at > now() - interval '3 hours') lignes_bouclier_3h, (select count(*) from mono.bouclier where left(why, 13) = '[observation]') notes_observation, (select count(*) from mono.bouclier) lignes_bouclier_total"
          bash tools/serveur/vps_sql.sh lecture "select at, left(why, 160) why from mono.bouclier order by at desc limit 15"
