          bash tools/serveur/vps_sql.sh lecture "select mono.pseudo(user_id) pseudo, etat, n, at, left(why, 140) why from (select distinct on (user_id) * from mono.verifs order by user_id, at desc) d order by at desc"
          bash tools/serveur/vps_sql.sh commande 'docker logs --since 3h supabase-edge-functions 2>&1 | grep -iE "mono" | grep -iE "error|erreur|exception|refus" | tail -20; echo "== appels mono (3 h) : $(docker logs --since 3h supabase-edge-functions 2>&1 | grep -ic mono)"'
      - name: Enquête absence (lecture seule, 06/11)
        # 06/11/2026 (retour du modérateur Likie : « j'ai rafraîchi pendant la sauvegarde et ça m'a compté 40 h d'absence »).
        # Lecture seule, 3 serveurs : écart entre l'heure de la partie (lastTick, écrite par le jeu) et l'heure d'arrivée sur le
        # serveur (updated_at). Un écart de plus de 30 min = l'heure du jeu était fausse quand la partie a été envoyée.
        # Puis les refus du Bouclier liés au temps (3 jours). Aucune partie n'est affichée, seulement des chiffres.
        if: inputs.etape == 'enquete-absence'
        env:
          PSEUDO: ${{ inputs.pseudo }}
        run: |
          q() { echo "== $1"; bash tools/serveur/vps_sql.sh lecture "$2" | python3 -c 'import json,sys; [print(json.dumps(r, ensure_ascii=False)) for r in json.load(sys.stdin)]'; }
          W="(substring(data from '\"lastTick\":([0-9]{12,14})'))::bigint"
          V="(substring(data from '\"savedAt\":([0-9]{12,14})'))::bigint"
          for sc in public s1; do
            q "Écarts heure du jeu / heure du serveur ($sc, parties envoyées depuis 3 jours, écart > 30 min)" "select p.pseudo, s.updated_at, s.game_version, s.device, round(((extract(epoch from s.updated_at) * 1000 - $W) / 60000)::numeric, 1) as ecart_min, round(((extract(epoch from s.updated_at) * 1000 - $V) / 60000)::numeric, 1) as ecart_save_min from $sc.saves s join public.profiles p on p.id = s.user_id where s.updated_at > now() - interval '3 days' and abs(extract(epoch from s.updated_at) * 1000 - $W) > 1800000 order by s.updated_at desc limit 80"
            q "Bouclier $sc, 3 jours, raisons liées au temps" "select p.pseudo, b.at, left(b.why, 160) why from $sc.bouclier_log b join public.profiles p on p.id = b.user_id where b.at > now() - interval '3 days' and (b.why ilike '%réelle%' or b.why ilike '%heure%' or b.why ilike '%temps%' or b.why ilike '%sablier%') order by b.at desc limit 60"
          done
          q "Écarts heure du jeu / heure du serveur (mono, 3 jours, > 30 min)" "select mono.pseudo(s.user_id) pseudo, s.saison, s.updated_at, s.game_version, s.device, round(((extract(epoch from s.updated_at) * 1000 - $W) / 60000)::numeric, 1) as ecart_min, round(((extract(epoch from s.updated_at) * 1000 - $V) / 60000)::numeric, 1) as ecart_save_min from mono.parties s where s.updated_at > now() - interval '3 days' and abs(extract(epoch from s.updated_at) * 1000 - $W) > 1800000 order by s.updated_at desc limit 80"
          q "Bouclier mono, 3 jours, raisons liées au temps" "select mono.pseudo(b.user_id) pseudo, b.at, left(b.why, 160) why from mono.bouclier b where b.at > now() - interval '3 days' and (b.why ilike '%réelle%' or b.why ilike '%heure%' or b.why ilike '%temps%' or b.why ilike '%sablier%') order by b.at desc limit 60"
          echo "== Honneur des parties Monocompte refusées pour l'honneur (partie envoyée et partie validée)"
          f="$RUNNER_TEMP/hon.json"
          bash tools/serveur/vps_sql.sh lecture "select mono.pseudo(m.user_id) pseudo, 'envoyee' quoi, m.updated_at at, m.data from mono.parties m where m.user_id in (select distinct user_id from mono.verifs where why like '%honneur (au plus%' and at > now() - interval '1 day') union all select mono.pseudo(o.user_id), 'validee', o.at, o.data from mono.parties_ok o where o.user_id in (select distinct user_id from mono.verifs where why like '%honneur (au plus%' and at > now() - interval '1 day') union all select mono.pseudo(m.user_id), 'temoin', m.updated_at, m.data from mono.parties m where mono.pseudo(m.user_id) in ('Ley', 'ChokeHola', 'Mycs', 'Jecht')" > "$f"
          node tools/enquete_honneur_mono.js "$f"; rm -f "$f"
          p=$(printf '%s' "$PSEUDO" | tr -cd 'A-Za-z0-9_-')
          if [ -n "$p" ]; then
            for sc in public s1; do
              q "$p sur $sc" "select p.pseudo, s.updated_at, s.game_version, s.device, s.meta->>'sa' as meta_sa, $V as saved_at, $W as last_tick, (substring(data from '\"playtime\":([0-9.]+)')) as playtime from public.profiles p join $sc.saves s on s.user_id = p.id where p.pseudo ilike '%$p%'"
              q "$p sur $sc, Bouclier (40 dernières lignes)" "select b.at, left(b.why, 200) why from $sc.bouclier_log b join public.profiles p on p.id = b.user_id where p.pseudo ilike '%$p%' order by b.at desc limit 40"
            done
            q "$p sur mono" "select mono.pseudo(s.user_id) pseudo, s.saison, s.updated_at, s.game_version, s.device, s.meta->>'sa' as meta_sa, $V as saved_at, $W as last_tick from mono.parties s join public.profiles p on p.id = s.user_id where p.pseudo ilike '%$p%'"
            q "$p sur mono, Bouclier et vérifications" "select b.at, left(b.why, 200) why from mono.bouclier b join public.profiles p on p.id = b.user_id where p.pseudo ilike '%$p%' order by b.at desc limit 40"
            q "$p sur mono, partie validée" "select o.at, o.src_at, (substring(o.data from '\"playtime\":([0-9.]+)')) as playtime_ok, (substring(m.data from '\"playtime\":([0-9.]+)')) as playtime_now, (substring(o.data from '\"kamas\":([0-9.]+)')) as kamas_ok, (substring(m.data from '\"kamas\":([0-9.]+)')) as kamas_now from mono.parties_ok o join mono.parties m on m.user_id = o.user_id and m.saison = o.saison join public.profiles p on p.id = o.user_id where p.pseudo ilike '%$p%'"
            q "$p sur mono, vérifications regroupées (2 jours)" "select v.etat, left(regexp_replace(coalesce(v.why, ''), '[0-9 ]+', '#', 'g'), 80) motif, min(v.at) debut, max(v.at) fin, count(*) n from mono.verifs v join public.profiles p on p.id = v.user_id where p.pseudo ilike '%$p%' and v.at > now() - interval '2 days' group by 1, 2 order by 3"
            q "Monocompte, refus du Bouclier par compte depuis 6 h (motifs)" "select mono.pseudo(v.user_id) pseudo, left(regexp_replace(coalesce(v.why, ''), '[0-9 ,]+', '#', 'g'), 70) motif, min(v.at) debut, count(*) n from mono.verifs v where v.etat = 'refus' and v.at > now() - interval '6 hours' group by 1, 2 order by 3 limit 60"
            q "$p sur mono, vérifications" "select v.at, v.etat, v.n, left(v.why, 200) why from mono.verifs v join public.profiles p on p.id = v.user_id where p.pseudo ilike '%$p%' order by v.at desc limit 30"
          fi
      - name: Codes cadeaux dans les parties (lecture seule, liste chiffrée)
        # 04/11/2026 (fil « Fermer la faille des codes cadeaux ») : codes cadeaux présents dans les parties des 3 serveurs,
        # comparés à ce que le serveur a enregistré (gift_uses). Lecture seule. En clair : seulement des totaux par code ;
        # la liste avec les pseudos est chiffrée avec une clé publique (la clé privée n'est pas dans le dépôt).
        if: inputs.etape == 'codes-suspects'
        run: |
          d="$RUNNER_TEMP/codes"; mkdir -p "$d"
          cat > "$d/cle.pub" <<'CLE'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAlCCEQh0dY6wgZl+9F+UT
          YgwebIlCUMP+VtemnbM7EUQgIi/sag5C9i8t7M8p7g1lKFNQPu0hdbfVcPgjJIP8
          Y0kOOjFVLXLd598uAPIr079wiJemeQzXpL+egv+yUaRt27O51pyxp4jW1cfp6cuJ
          zNmAObaYpZsakAbZSpq4VSaq8g9iyk6f+5bqTQ7Fj6sH3NkIkx61aC4NN30EHFX+
          BoVCxudWh3gf+GDDBEPFYw4j2vxxOobs85Ofe1o7GUssqINRlh9A4j9s8rQFEHYr
          CkvGm5SSwN9jZLxwAhPe2vScOmIsoI+P/rIl4kyHrfydyyeSNcAcLlhq5j9VHcm+
          /bt+x11Z1nYdZ6uTwZ2/AdSNbozrACi27Sq9ysz0h9Jto1zYIHC4dQ9oJnQ05vDG
          b/waRNLr+X4oyXn6N8v1EKOUGwMLXU+HL/IkBLGNu0wNpKRv+F5eHyl9V2x+zA3v
          BQNls/BNobrxEG9U48uhiH9rzON5O+MWNJjB9eEBTa0nAgMBAAE=
          -----END PUBLIC KEY-----
          CLE
          bash tools/serveur/vps_sql.sh lecture "with a as (
              select 'eternel' srv, s.user_id, (s.data::jsonb)->'gifts' g, s.updated_at from public.saves s
              union all select 's1', s.user_id, (s.data::jsonb)->'gifts', s.updated_at from s1.saves s
              union all select 'mono', m.user_id, (m.data::jsonb)->'gifts', m.updated_at from mono.parties m),
            k as (select a.srv, a.user_id, e.key, e.value, a.updated_at from a, jsonb_each(case when jsonb_typeof(a.g) = 'object' then a.g else '{}'::jsonb end) e)
            select k.srv, public.pseudo_of(k.user_id) pseudo, k.key, k.value::text v, k.updated_at,
              case when k.key like 'srv:%' then exists (select 1 from public.gift_uses u where u.user_id = k.user_id and u.code = substr(k.key, 5)) end as enregistre,
              (select l.level from public.ladder l where l.user_id = k.user_id) niv_eternel,
              (select l.level from s1.ladder l where l.user_id = k.user_id) niv_s1
            from k order by k.key, k.srv" > "$d/codes.json"
          node -e '
            const L = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); const T = {};
            const day = (v) => { const n = Number(String(v).replace(/"/g, "")); return n > 1e12 ? new Date(n).toISOString().slice(0, 16) : "?"; };
            L.forEach((x) => { const t = T[x.key] = T[x.key] || { n: 0, eternel: 0, s1: 0, mono: 0, nonEnregistre: 0, premier: "9", dernier: "" };
              t.n++; t[x.srv]++; if (x.enregistre === false) t.nonEnregistre++; const d = day(x.v); if (d < t.premier) t.premier = d; if (d > t.dernier) t.dernier = d; });
            console.log("Lignes :", L.length, "· codes différents :", Object.keys(T).length);
            Object.keys(T).sort((a, b) => T[b].n - T[a].n).forEach((k) => { const t = T[k]; console.log([/^srv:/.test(k) ? k : "ancien:" + k.slice(0, 3) + "…(" + k.length + ")", t.n, "E" + t.eternel, "S1-" + t.s1, "M" + t.mono, "non-enregistres " + t.nonEnregistre, t.premier, t.dernier].join(" | ")); });
          ' "$d/codes.json"
          openssl rand -hex 32 > "$d/k"
          gzip -9c "$d/codes.json" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:"$d/k" | base64 -w0 > "$d/c.b64"
          echo "== CLE CHIFFREE"; openssl pkeyutl -encrypt -pubin -inkey "$d/cle.pub" -pkeyopt rsa_padding_mode:oaep -in "$d/k" | base64 -w0; echo
          echo "== LISTE CHIFFREE ($(wc -c < "$d/c.b64") octets)"; fold -w 4000 "$d/c.b64"; echo
          rm -rf "$d"
      - name: Audit de sécurité de la base (lecture seule, aucune donnée de joueur, 05/11)
        # Fil « Grand nettoyage des bugs et failles » : droits des fonctions et des tables vus par le jeu (anon, authenticated).
        if: inputs.etape == 'audit-securite'
        run: |
          for q in ${AUDIT_Q:-fonctions tables colonnes annonces politiques secrets comptes admins}; do echo "== $q"; bash tools/serveur/vps_sql.sh lecture "$(cat tools/serveur/audit/$q.sql)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const i=s.indexOf("[");const L=JSON.parse(s.slice(i));console.log(L.length+" lignes");L.forEach(x=>console.log(Object.values(x).map(v=>v===null?"-":v===true?"o":v===false?"n":String(v).slice(0,300)).join(" | ")))})'; done
      - name: Inscription par téléphone coupée (11/11, audit de sécurité, Discord seulement)
        if: inputs.etape == 'inscription-telephone'
        run: bash tools/serveur/vps_sql.sh commande "$(cat tools/serveur/inscription_telephone.sh)"
      - name: Droits d'écriture des joueurs retirés des tables (sauvegarde de la base, supabase/droits.sql, 05/11)
        if: inputs.etape == 'droits-ecriture'
        run: |
          echo '== Sauvegarde complète de la base avant installation'
          bash tools/serveur/vps_sql.sh commande 'set -euo pipefail; mkdir -p /opt/idlus/sauvegardes; f=/opt/idlus/sauvegardes/avant-droits-$(date +%Y-%m-%d-%H%M).sql.gz; docker exec supabase-db pg_dumpall -U postgres --clean --if-exists | gzip > $f.part; mv $f.part $f; ls -l $f; [ $(stat -c %s $f) -gt 100000 ] || { echo "sauvegarde trop petite" >&2; exit 1; }'
          { echo "set lock_timeout = '3s';"; cat supabase/droits.sql; } > /tmp/q.sql
          for essai in 1 2 3 4 5 6; do
            if bash tools/serveur/vps_sql.sh fichier /tmp/q.sql > /tmp/r.txt 2>&1; then echo "OK (essai $essai)"; break; fi
            tail -c 800 /tmp/r.txt; echo
            if grep -qiE 'lock timeout|deadlock' /tmp/r.txt && [ "$essai" -lt 6 ]; then sleep $((essai * 10)); continue; fi
            exit 1
          done
          bash tools/serveur/vps_sql.sh lecture "select count(*) filter (where privilege_type in ('INSERT', 'UPDATE', 'DELETE', 'TRUNCATE')) ecritures_restantes, string_agg(distinct table_schema || '.' || table_name || ':' || privilege_type, ' ') filter (where privilege_type in ('INSERT', 'UPDATE', 'DELETE', 'TRUNCATE')) lesquelles from information_schema.role_table_grants where grantee in ('anon', 'authenticated') and table_schema in ('public', 's1', 'mono')"
      - name: Sauvegarde complète de la base (avant une installation SQL)
        # 04/11/2026 : les installations de fonctions et de schéma SQL sont autorisées par Mathis « tests passés, sauvegarde de la base avant ».
        if: inputs.etape == 'sauvegarde-base'
        run: |
          bash tools/serveur/vps_sql.sh commande 'set -euo pipefail; mkdir -p /opt/idlus/sauvegardes; f=/opt/idlus/sauvegardes/avant-install-$(date +%Y-%m-%d-%H%M).sql.gz; docker exec supabase-db pg_dumpall -U postgres --clean --if-exists | gzip > "$f"; ls -lh "$f"'
      - name: Diagnostic (lecture seule)
        if: inputs.etape == 'diagnostic'
        run: |
          echo "SSHO=$SSHO" >> "$GITHUB_ENV"
          bash tools/serveur/vps_sql.sh commande "docker ps --format '{{.Names}} {{.Image}} {{.Status}}'; echo '== Realtime (journal récent)'; docker logs --since 30m realtime-dev.supabase-realtime 2>&1 | grep -viE 'debug' | tail -60; echo '== Réglages du direct'; docker exec supabase-db psql -U supabase_admin -d postgres -Atc \"select name, max_concurrent_users, max_events_per_second, max_presence_events_per_second, max_joins_per_second, private_only from _realtime.tenants\" 2>&1 | head"
          # 15/10/2026 : journal de la fonction « record » (Boss des mondes, Kolizéum, guildes…) et derniers essais du boss, sans données personnelles
          bash tools/serveur/vps_sql.sh commande "echo '== Fonction record (journal récent)'; docker logs --since 60m supabase-edge-functions 2>&1 | grep -iE 'error|erreur|exception|limit|timeout|boot' | tail -40; echo '== Routeur des fonctions (limites)'; grep -nE 'Limit|Timeout|userWorkers.create|EdgeRuntime' volumes/functions/main/index.ts; docker inspect supabase-edge-functions --format '{{json .Config.Cmd}} {{json .Config.Image}}'"
          bash tools/serveur/vps_sql.sh lecture "select n, count(*) as essais, max(at) as dernier from public.wb_hits where at > now() - interval '3 hours' group by n order by n"
          bash tools/serveur/vps_sql.sh lecture "select (select count(*) from auth.users where last_sign_in_at > now() - interval '2 hours') as connexions_2h, (select count(*) from public.saves where updated_at > now() - interval '15 minutes') as envois_15min, (select count(*) from public.saves where updated_at > now() - interval '1 hour') as envois_1h"
