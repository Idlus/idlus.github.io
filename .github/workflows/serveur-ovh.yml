        run: |
          echo '== Sauvegarde complète de la base avant installation'
          bash tools/serveur/vps_sql.sh commande 'set -euo pipefail; mkdir -p /opt/idlus/sauvegardes; f=/opt/idlus/sauvegardes/avant-hauts-faits-$(date +%Y-%m-%d-%H%M).sql.gz; docker exec supabase-db pg_dumpall -U postgres --clean --if-exists | gzip > $f.part; mv $f.part $f; ls -l $f; [ $(stat -c %s $f) -gt 100000 ] || { echo "sauvegarde trop petite" >&2; exit 1; }'
          for f in supabase/chat.sql supabase/chat_s1.sql; do
            echo "== $f"
            { echo "set lock_timeout = '3s';"; cat "$f"; } > /tmp/q.sql
            for essai in 1 2 3 4 5 6; do
              if bash tools/serveur/vps_sql.sh fichier /tmp/q.sql > /tmp/r.txt 2>&1; then echo "OK (essai $essai)"; break; fi
              tail -c 800 /tmp/r.txt; echo
              if grep -qiE 'lock timeout|deadlock' /tmp/r.txt && [ "$essai" -lt 6 ]; then sleep $((essai * 10)); continue; fi
              exit 1
            done
          done
          bash tools/serveur/vps_sql.sh lecture "select p.oid::regprocedure::text as fonction, p.prosrc like '%''srv''%' as pose_le_serveur from pg_proc p where p.proname = 'chat_ann'"
      - name: Enquête stasis, rejeu des plus hautes stasis d'un joueur (lecture seule, demande de Mathis du 04/11)
        if: inputs.etape == 'enquete-stasis'
