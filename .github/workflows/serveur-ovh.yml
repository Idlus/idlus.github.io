          awk '/^create or replace function s1\.koli_done\(/{on=1} on{print} /^revoke all on function s1\.koli_done\(/{on=0}' supabase/saison1.sql > /tmp/koli_s1.sql
          grep -q "when 's1' then 'sv'" /tmp/koli_s1.sql || { echo "s1.koli_done introuvable dans saison1.sql" >&2; exit 1; }
