# Serveur en ligne (multijoueur) : à chaque push sur la branche « beta » qui touche la base ou le moteur,
# applique les fichiers SQL de supabase/ et redéploie la fonction « record » (qui rejoue les donjons
# avec le même moteur que le jeu). Secret nécessaire : SUPABASE_ACCESS_TOKEN (clé d'accès du compte Supabase de Mathis).
name: Serveur en ligne
on:
  push:
    branches: [beta]
    paths: ["supabase/**", "js/engine.js", "js/systems.js", "js/data.js", "js/gamedata.js", "js/pets.js", "js/mounts.js", "js/idols.js", "js/renaissance.js", "js/archis.js", "js/defi.js", "js/gboss.js", "js/verify.js", "tools/build_server.js", ".github/workflows/supabase.yml"]
concurrency:
  group: serveur-en-ligne
  cancel-in-progress: false
env:
  PROJECT_REF: bolbuxuxydfslwpfbfff
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Base de données (fichiers SQL)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN manquant." >&2; exit 1; fi
          for f in supabase/schema.sql supabase/classements.sql supabase/chat.sql supabase/defi.sql supabase/hdv_data.sql supabase/hdv.sql supabase/guildes.sql supabase/carnet.sql supabase/percos_data.sql supabase/gboss.sql; do
            echo "== $f"
            jq -Rs '{query: .}' "$f" > /tmp/q.json
            code=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
            echo "HTTP $code"; head -c 600 /tmp/r.json; echo
            if [ "$code" -ge 300 ]; then exit 1; fi
          done
      - name: Contrôle (comptes, administrateur)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q='select (select count(*) from public.profiles) as comptes, (select count(*) from public.saves) as parties, (select count(*) from public.ladder) as classes, (select string_agg(p.pseudo, chr(44)) from public.admins a join public.profiles p on p.id = a.user_id) as admin'
          jq -n --arg q "$q" '{query: $q}' > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json; echo
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Code du jeu pour le serveur
        run: node tools/build_server.js
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Fonction « record »
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy record --project-ref "$PROJECT_REF" --use-api || supabase functions deploy record --project-ref "$PROJECT_REF" --debug
