          q "Idées par jour (7 jours) : reçues / cachées / publiées sur Discord" "select to_char(created_at at time zone 'Europe/Paris','DD/MM') as jour, count(*) as recues, count(*) filter (where hidden) as cachees, count(relayed_at) as publiees from public.ideas where created_at > now() - interval '7 days' group by 1 order by 1"
