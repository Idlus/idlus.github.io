# Rapport du serveur (à la demande) : donne les chiffres du serveur en ligne (joueurs, comptes, actifs du jour,
# taille de la base, mémoire, processeur, disque) en lecture seule, sans jamais afficher la clé ni une donnée personnelle.
# Lancement : onglet Actions > « Rapport du serveur » > Run workflow (ou Claude, sur demande dans le projet).
# Le rapport s'affiche dans le résumé de l'exécution et dans le journal de l'étape « Rapport ».
name: Rapport du serveur
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rapport-serveur
  cancel-in-progress: false
env:
  PROJECT_REF: bolbuxuxydfslwpfbfff
jobs:
  rapport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rapport
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN manquant." >&2; exit 1; fi
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"
          # Requête en lecture seule (read_only : la base refuse toute écriture).
          jq -Rs '{query: ., read_only: true}' tools/rapport_serveur.sql > /tmp/q.json
          code=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "$api/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          if [ "$code" -ge 300 ]; then echo "Erreur HTTP $code"; head -c 600 /tmp/r.json; echo; exit 1; fi
          # État du projet (nom, région, état) : aucune donnée de joueur.
          curl -sS "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -o /tmp/p.json || echo '{}' > /tmp/p.json
          # Machine du serveur (mémoire, processeur, disque) : métriques Supabase, lues avec la clé de service
          # récupérée ici et masquée dans le journal ; elle n'est jamais affichée ni enregistrée (accord de Mathis, 12/10).
          echo '{}' > /tmp/m.json
          cle=$(curl -sS "$api/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty' 2>/dev/null || true)
          if [ -n "$cle" ]; then
            echo "::add-mask::$cle"
            url="https://$PROJECT_REF.supabase.co/customer/v1/privileged/metrics"
            if curl -sSf -u "service_role:$cle" "$url" -o /tmp/m1.txt; then
              sleep 10
              curl -sSf -u "service_role:$cle" "$url" -o /tmp/m2.txt || cp /tmp/m1.txt /tmp/m2.txt
              node tools/rapport_metriques.js /tmp/m1.txt /tmp/m2.txt > /tmp/m.json || echo '{}' > /tmp/m.json
            else echo "Métriques de la machine indisponibles."; fi
          else echo "Clé de service introuvable : pas de métriques de la machine."; fi
          unset cle
          jq -n --slurpfile r /tmp/r.json --slurpfile p /tmp/p.json --slurpfile m /tmp/m.json \
            '($r[0][0]) + {etat_serveur: ($p[0].status // "?"), region: ($p[0].region // "?")} + $m[0]' > rapport.json
          echo "== RAPPORT"; cat rapport.json
          {
            echo "## Rapport du serveur"
            echo
            echo "| Mesure | Valeur |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key | gsub("_"; " ")) | \(.value) |"' rapport.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-serveur
          path: rapport.json
          retention-days: 30
