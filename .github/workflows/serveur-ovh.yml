          bash tools/serveur/vps_sql.sh commande 'set -euo pipefail; mkdir -p /opt/idlus/sauvegardes; f=/opt/idlus/sauvegardes/avant-saison1-$(date +%Y-%m-%d-%H%M).sql.gz; docker exec supabase-db pg_dumpall -U postgres --clean --if-exists | gzip > "$f"; ls -lh "$f"'
          for f in supabase/tournoi.sql supabase/saison1.sql; do
            echo "== $f"
            { echo "set lock_timeout = '3s';"; cat "$f"; } > /tmp/q.sql
            for essai in 1 2 3 4 5 6; do
