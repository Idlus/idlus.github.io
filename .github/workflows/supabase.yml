# Serveur en ligne (multijoueur) : à chaque push sur la branche « main » (le jeu public) qui touche la base ou le moteur,
# applique les fichiers SQL de supabase/ et redéploie la fonction « record » (qui rejoue les donjons
# avec le même moteur que le jeu).
# Depuis le déménagement (14/10/2026) : serveur OVH, joint par SSH (secrets VPS_HOST, VPS_USER, VPS_NEW_PASSWORD ;
# tools/serveur/vps_sql.sh). La fonction « record » est copiée dans /opt/idlus/supabase/volumes/functions/record.
# 13/10/2026 (accord de Mathis) : seuls les fichiers SQL modifiés par le push sont réappliqués (aucun si la base ne change pas),
# avec un délai de verrou de 3 s : un verrou qui attend plus longtemps abandonne (et réessaie) au lieu de bloquer les joueurs.
# Lancement à la main (Actions > Serveur en ligne > Run workflow) : réapplique tous les fichiers.
name: Serveur en ligne
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**", "js/engine.js", "js/systems.js", "js/data.js", "js/gamedata.js", "js/armes.js", "js/drops.js", "js/pieces.js", "js/pets.js", "js/mounts.js", "js/elevage.js", "js/idols.js", "js/renaissance.js", "js/identite.js", "js/identmon.js", "js/identboss.js", "js/archis.js", "js/defi.js", "js/gboss.js", "js/koli.js", "js/legendaires.js", "js/dofusp.js", "js/collections.js", "js/wboss.js", "js/songe.js", "js/alliance.js", "js/champions.js", "js/verify.js", "tools/build_server.js", "tools/serveur/vps_sql.sh", "tools/serveur/sql_distant.sh", ".github/workflows/supabase.yml"]
concurrency:
  group: serveur-en-ligne
  cancel-in-progress: false
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps
        with:
          hote: ${{ secrets.VPS_HOST }}
          util: ${{ secrets.VPS_USER }}
          pass: ${{ secrets.VPS_NEW_PASSWORD }}
      - name: Base de données (fichiers SQL modifiés)
        env:
          AVANT: ${{ github.event.before }}
        run: |
          tous="supabase/schema.sql supabase/classements.sql supabase/chat.sql supabase/defi.sql supabase/hdv_data.sql supabase/hdv.sql supabase/guildes.sql supabase/carnet.sql supabase/percos_data.sql supabase/gboss.sql supabase/codes.sql supabase/idees.sql supabase/bugs.sql supabase/builds.sql supabase/brisage.sql supabase/koli.sql supabase/wboss.sql supabase/fiches.sql supabase/collections.sql supabase/alignement.sql supabase/songe.sql supabase/vente_data.sql supabase/vente.sql supabase/foire.sql supabase/chromatiques.sql supabase/alliances_data.sql supabase/alliances.sql supabase/ascension.sql supabase/elevage.sql supabase/annonces_boucle.sql supabase/pluie.sql"
          # Fichiers modifiés par ce push (tous si lancé à la main, ou si le commit d'avant est introuvable)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$AVANT" ] && ! echo "$AVANT" | grep -qE '^0+$' && git fetch -q --depth=1 origin "$AVANT" 2>/dev/null; then
            changes=$(git diff --name-only "$AVANT" "$GITHUB_SHA" -- supabase/) || changes=$(echo $tous | tr ' ' '\n')
          else
            changes=$(echo $tous | tr ' ' '\n')
          fi
          a_faire=""
          for f in $tous; do if echo "$changes" | grep -qx "$f"; then a_faire="$a_faire $f"; fi; done
          if [ -z "$a_faire" ]; then echo "La base ne change pas dans ce push : aucun fichier SQL réappliqué."; exit 0; fi
          for f in $a_faire; do
            echo "== $f"
            # Délai de verrou de 3 s : si une table est occupée par les joueurs, on abandonne vite et on réessaie
            { echo "set lock_timeout = '3s';"; cat "$f"; } > /tmp/q.sql
            for essai in 1 2 3 4 5 6; do
              if bash tools/serveur/vps_sql.sh fichier /tmp/q.sql > /tmp/r.txt 2>&1; then echo "OK (essai $essai)"; break; fi
              tail -c 800 /tmp/r.txt; echo
              # Verrou trop long (55P03) ou interblocage (40P01) : on attend un peu et on réessaie
              if grep -qiE 'lock timeout|deadlock' /tmp/r.txt && [ "$essai" -lt 6 ]; then sleep $((essai * 10)); continue; fi
              exit 1
            done
          done
      - name: Contrôle (comptes, administrateur)
        run: |
          bash tools/serveur/vps_sql.sh lecture 'select (select count(*) from public.profiles) as comptes, (select count(*) from public.saves) as parties, (select count(*) from public.ladder) as classes, (select string_agg(p.pseudo, chr(44)) from public.admins a join public.profiles p on p.id = a.user_id) as admin'
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Code du jeu pour le serveur
        run: node tools/build_server.js
      - name: Fonction « record »
        run: |
          d=$(sshpass -e ssh $SSHO "$UTIL@$HOTE" 'mktemp -d /tmp/idlus-record.XXXXXX')
          sshpass -e scp -q $SSHO supabase/functions/record/index.ts supabase/functions/record/game.js "$UTIL@$HOTE:$d/"
          # Remplace la fonction et redémarre le service des fonctions (quelques secondes)
          bash tools/serveur/vps_sql.sh commande "set -e; mkdir -p volumes/functions/record; cp $d/index.ts $d/game.js volumes/functions/record/; rm -rf $d; docker compose restart functions >/dev/null; echo 'Fonction record en place.'"
