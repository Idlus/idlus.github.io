          bash tools/serveur/vps_sql.sh lecture "select p.pseudo, o.at as ok_at, o.data as ok_data,
            (select coalesce(json_agg(x order by x.k desc), '[]') from (select r.dname, r.k, r.t, r.at from public.records r where r.user_id = p.id) x) as records
            from public.profiles p join public.saves_ok o on o.user_id = p.id where lower(p.pseudo) = lower('$p')" > "$f"
