# Vérification automatique à chaque push et pull request :
# syntaxe des fichiers JS, combat simulé avec le moteur, démarrage du jeu dans Chromium.
name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # garde-fou (14/10/2026) : une publication ne doit effacer aucune version déjà publiée ni faire reculer le numéro
      - name: Garde-fou des publications
        run: |
          REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$REF" ] && ! echo "$REF" | grep -qE '^0+$'; then git fetch -q --depth=1 origin "$REF" || true; fi
          node tools/garde_fou.js "$REF"
      - name: Syntaxe JS
        run: npm run check
      - name: Combat simulé (moteur)
        run: npm run test:fight
      - name: Équilibrage des stasis (informatif, n'échoue pas)
        run: npm run sim || true
      - name: Installation de Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Démarrage du jeu dans le navigateur
        run: npm run test:smoke
      # audit 19/10/2026 : compte et sauvegarde en ligne avec le faux serveur des tests (aucun accès au vrai serveur)
      - name: Compte et sauvegarde en ligne (faux serveur)
        run: npm run test:online
